name: Temporary MailPin rebrand

on:
  push:
    branches:
      - "brand/mailpin-1.6.0"

permissions:
  contents: write

concurrency:
  group: mailpin-rebrand-1-6-0
  cancel-in-progress: false

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: brand/mailpin-1.6.0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply MailPin 1.6.0 rebrand
        run: |
          python scripts/rebrand_mailpin_once.py
          python scripts/rebrand_mailpin_fix_once.py
      - name: Targeted identity and metadata guards
        run: |
          python tests/test_project_metadata.py
          python tests/static_checks.py
          python scripts/check_versions.py
          python scripts/check_repo.py
      - name: Stage transformed tree for release gate
        run: |
          git add -A
          git diff --cached --check
      - name: Full release gate
        run: npm run ci
      - name: Diff hygiene
        run: git diff --cached --check
      - name: Commit rebrand branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "feat: rebrand MailPerch as MailPin 1.6.0"
          git push origin HEAD:brand/mailpin-1.6.0
