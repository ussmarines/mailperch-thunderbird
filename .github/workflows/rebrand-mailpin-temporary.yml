- `tests/static_checks.py`
- `tests/test_project_metadata.py`
- `BRANDING.md`
- `README.md` / `README.en.md`

## Immutabilité après publication

Une fois MailPin soumis/publié sur ATN avec `{NEW_ID}`, cet identifiant devient immuable. Toute release ultérieure doit conserver exactement la même chaîne et la même casse.
'''
