name: Temporary MailPin rebrand

on:
  push:
    branches:
      - "brand/mailpin-1.6.0"

permissions:
  contents: write

concurrency:
  group: mailpin-rebrand-1-6-0
  cancel-in-progress: false

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: brand/mailpin-1.6.0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply MailPin 1.6.0 rebrand
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations
          import json
          import re
          import shutil
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          VERSION = "1.6.0"
          OLD_BRAND = "MailPerch"
          BRAND = "MailPin"
          OLD_ID = "pin-mails@MailPerch.local"
          INTERMEDIATE_ID = "pin-mails@MailPin.local"
          NEW_ID = "ussmarines.mailpin@addons.thunderbird.net"
          REPO = "https://github.com/ussmarines/mailperch-thunderbird"
          TEXT_SUFFIXES = {".md", ".js", ".mjs", ".json", ".css", ".html", ".py", ".yml", ".yaml", ".txt", ".svg"}
          TEXT_NAMES = {"LICENSE", ".editorconfig", ".gitattributes", ".gitignore", ".gitleaks.toml"}

          def tracked() -> list[Path]:
              out = subprocess.check_output(["git", "ls-files", "-z"])
              return [ROOT / item.decode("utf-8") for item in out.split(b"\0") if item]

          def is_historical(path: Path) -> bool:
              rel = path.relative_to(ROOT).as_posix()
              name = path.name
              if rel.startswith("docs/archive/") or rel.startswith("brain/"):
                  return True
              if re.match(r"^(?:SECURITY_AUDIT|VALIDATION_REPORT|AUDIT_REPORT)_.*\.md$", name):
                  return True
              if "FUNCTIONAL_AUDIT_" in name:
                  return True
              return False

          def write_text(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text.rstrip() + "\n", encoding="utf-8", newline="\n")

          # 1) Rename active product references while preserving immutable historical reports/Brain.
          for path in tracked():
              if not path.is_file() or is_historical(path):
                  continue
              if path.suffix.lower() not in TEXT_SUFFIXES and path.name not in TEXT_NAMES:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace(OLD_BRAND, BRAND)
              updated = updated.replace(OLD_ID, NEW_ID).replace(INTERMEDIATE_ID, NEW_ID)
              updated = updated.replace("MailPin — Email Pins & Follow-up", "MailPin — Email Follow-up & Productivity for Thunderbird")
              updated = updated.replace("Épinglez, organisez et suivez vos e-mails dans Thunderbird.", "Suivi d’e-mails & productivité pour Thunderbird.")
              updated = updated.replace("Pin, organize and follow up on your emails in Thunderbird.", "Email Follow-up & Productivity for Thunderbird")
              updated = updated.replace("Keep important mail within reach.", "Stay on top. Follow through. Get results.")
              updated = updated.replace("Gardez vos messages importants à portée de main.", "Gardez le cap. Assurez le suivi. Avancez.")
              updated = updated.replace("mailperch-project-knowledge", "mailpin-project-knowledge")
              updated = updated.replace(".mailperch-source-files.json", ".mailpin-source-files.json")
              if updated != text:
                  write_text(path, updated)

          # 2) Rename the current project knowledge skill directory (Brain stays CLI-managed and untouched).
          old_skill = ROOT / ".agents/skills/mailperch-project-knowledge"
          new_skill = ROOT / ".agents/skills/mailpin-project-knowledge"
          if old_skill.exists() and not new_skill.exists():
              old_skill.rename(new_skill)

          # 3) Canonical package metadata.
          package_path = ROOT / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["name"] = "mailpin-thunderbird"
          package["version"] = VERSION
          package["description"] = "Build, test, and release tooling for MailPin — Email Follow-up & Productivity for Thunderbird."
          write_text(package_path, json.dumps(package, ensure_ascii=False, indent=2))

          # 4) Canonical manifest and SVG-only scalable brand icon (supported by Thunderbird).
          manifest_path = ROOT / "extension/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = VERSION
          manifest["browser_specific_settings"]["gecko"]["id"] = NEW_ID
          brand_icon = "icons/mailpin-icon.svg"
          manifest["icons"] = {str(size): brand_icon for size in (16, 24, 32, 48, 64, 96, 128)}
          manifest["action"]["default_icon"] = {"16": brand_icon, "32": brand_icon}
          write_text(manifest_path, json.dumps(manifest, ensure_ascii=False, indent=2))

          # 5) Locales: all legacy product strings already renamed, then set explicit public positioning.
          def locale(path: Path, lang: str) -> None:
              data = json.loads(path.read_text(encoding="utf-8"))
              def setmsg(key: str, value: str) -> None:
                  if key in data and isinstance(data[key], dict):
                      data[key]["message"] = value
              setmsg("extensionName", "MailPin — Email Follow-up & Productivity for Thunderbird")
              setmsg("extensionShortName", "MailPin")
              setmsg("brandSubtitle", "Email Follow-up & Productivity for Thunderbird")
              setmsg("brandSlogan", "Stay on top. Follow through. Get results." if lang == "en" else "Gardez le cap. Assurez le suivi. Avancez.")
              if lang == "fr":
                  setmsg("extensionDescription", "Épinglez, organisez et suivez vos e-mails importants dans Thunderbird avec notes, sous-tâches, rappels, vues, Agenda et tableau de bord local.")
              else:
                  setmsg("extensionDescription", "Pin, organize, and follow up on important email in Thunderbird with notes, subtasks, reminders, saved views, Calendar integration, and a local dashboard.")
              write_text(path, json.dumps(data, ensure_ascii=False, indent=2))
          locale(ROOT / "extension/_locales/fr/messages.json", "fr")
          locale(ROOT / "extension/_locales/en/messages.json", "en")

          # 6) Professional, deterministic vector identity. No gradients, no remote assets.
          icon_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MailPin">
            <style>
              .ink{fill:none;stroke:#1A1D21;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
              .pin{fill:#4F7F75}
              @media (prefers-color-scheme: dark){.ink{stroke:#F7F5F0}}
            </style>
            <path class="ink" d="M16 53v51c0 5 4 8 9 8h78c5 0 9-3 9-8V53L78 79c-8 6-20 6-28 0L16 53Z"/>
            <path class="ink" d="m18 55 37 30c5 4 13 4 18 0l37-30"/>
            <path class="pin" fill-rule="evenodd" d="M64 8c-19 0-34 15-34 34 0 25 34 59 34 59s34-34 34-59C98 23 83 8 64 8Zm0 18a16 16 0 1 0 0 32 16 16 0 0 0 0-32Z"/>
          </svg>'''
          mono_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MailPin">
            <style>.mark{fill:none;stroke:#1A1D21;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}@media(prefers-color-scheme:dark){.mark{stroke:#F7F5F0}}</style>
            <path class="mark" d="M16 53v51c0 5 4 8 9 8h78c5 0 9-3 9-8V53L78 79c-8 6-20 6-28 0L16 53Z"/>
            <path class="mark" d="m18 55 37 30c5 4 13 4 18 0l37-30"/>
            <path class="mark" d="M64 10c-18 0-32 14-32 32 0 24 32 57 32 57s32-33 32-57c0-18-14-32-32-32Z"/>
            <circle class="mark" cx="64" cy="42" r="14"/>
          </svg>'''
          write_text(ROOT / "extension/icons/mailpin-icon.svg", icon_svg)
          write_text(ROOT / "extension/icons/mailpin-icon-mono.svg", mono_svg)
          for old in list((ROOT / "extension/icons").glob("mailperch-icon*")):
              if old.is_file():
                  old.unlink()

          brand_dir = ROOT / "assets/brand"
          brand_dir.mkdir(parents=True, exist_ok=True)
          write_text(brand_dir / "mailpin-mark.svg", icon_svg)

          hero_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
            <title id="title">MailPin — Email Follow-up &amp; Productivity for Thunderbird</title>
            <desc id="desc">MailPin brand hero with email pin, follow-up card, reminder, checklist and calendar motifs.</desc>
            <rect width="1600" height="720" fill="#F7F5F0"/>
            <g transform="translate(90 150)">
              <g transform="scale(1.45)">
                <path fill="none" stroke="#1A1D21" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M16 53v51c0 5 4 8 9 8h78c5 0 9-3 9-8V53L78 79c-8 6-20 6-28 0L16 53Z"/>
                <path fill="none" stroke="#1A1D21" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="m18 55 37 30c5 4 13 4 18 0l37-30"/>
                <path fill="#4F7F75" fill-rule="evenodd" d="M64 8c-19 0-34 15-34 34 0 25 34 59 34 59s34-34 34-59C98 23 83 8 64 8Zm0 18a16 16 0 1 0 0 32 16 16 0 0 0 0-32Z"/>
              </g>
              <text x="210" y="95" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="96" font-weight="650" fill="#1A1D21">MailPin</text>
              <text x="214" y="151" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="29" font-weight="500" fill="#3D536B">Email Follow-up &amp; Productivity for Thunderbird</text>
              <text x="214" y="205" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="21" fill="#5F696E">Stay on top. Follow through. Get results.</text>
            </g>
            <g transform="translate(980 108)" font-family="Inter,Segoe UI,system-ui,sans-serif">
              <rect x="80" y="38" width="405" height="145" rx="16" fill="#FFFFFF" stroke="#D7D3CA" stroke-width="2"/>
              <path fill="#4F7F75" d="M128 66c-13 0-23 10-23 23 0 17 23 40 23 40s23-23 23-40c0-13-10-23-23-23Zm0 12a11 11 0 1 0 0 22 11 11 0 0 0 0-22Z"/>
              <text x="170" y="91" font-size="25" font-weight="650" fill="#1A1D21">Follow up with Alex</text>
              <text x="170" y="123" font-size="18" fill="#3D536B">Re: Project proposal</text>
              <text x="170" y="153" font-size="16" fill="#6B7377">Tomorrow · 10:00</text>
              <rect x="0" y="226" width="325" height="216" rx="16" fill="#FFFFFF" stroke="#D7D3CA" stroke-width="2"/>
              <rect x="0" y="226" width="58" height="216" rx="16" fill="#4F7F75"/>
              <path d="M22 275h14m-14 48h14m-14 48h14" stroke="#F7F5F0" stroke-width="4" stroke-linecap="round"/>
              <text x="84" y="276" font-size="20" fill="#1A1D21">Follow up</text>
              <text x="84" y="325" font-size="20" fill="#1A1D21">Send recap</text>
              <text x="84" y="374" font-size="20" fill="#1A1D21">Review proposal</text>
              <text x="84" y="423" font-size="20" fill="#1A1D21">Schedule call</text>
              <rect x="352" y="238" width="182" height="66" rx="33" fill="#F7F5F0" stroke="#C79A3A" stroke-width="2"/>
              <circle cx="387" cy="271" r="11" fill="none" stroke="#C79A3A" stroke-width="3"/>
              <path d="M387 264v8l6 4" fill="none" stroke="#C79A3A" stroke-width="3" stroke-linecap="round"/>
              <text x="414" y="280" font-size="19" font-weight="600" fill="#9A6E17">Tomorrow</text>
              <rect x="355" y="332" width="180" height="174" rx="16" fill="#FFFFFF" stroke="#D7D3CA" stroke-width="2"/>
              <rect x="355" y="332" width="180" height="40" rx="16" fill="#3D536B"/>
              <g fill="#D7D3CA">
                <circle cx="385" cy="399" r="6"/><circle cx="417" cy="399" r="6"/><circle cx="449" cy="399" r="6"/><circle cx="481" cy="399" r="6"/><circle cx="513" cy="399" r="6"/>
                <circle cx="385" cy="431" r="6"/><circle cx="417" cy="431" r="6"/><circle cx="449" cy="431" r="6"/><circle cx="481" cy="431" r="6"/><circle cx="513" cy="431" r="6"/>
                <circle cx="385" cy="463" r="6"/><circle cx="417" cy="463" r="6"/><circle cx="449" cy="463" r="6"/><circle cx="481" cy="463" r="6"/><circle cx="513" cy="463" r="6"/>
              </g>
              <circle cx="449" cy="431" r="7" fill="#4F7F75"/><circle cx="481" cy="463" r="7" fill="#C79A3A"/>
              <path d="M325 336h28M485 184v38M325 408h28" fill="none" stroke="#B8B2A7" stroke-width="2" stroke-dasharray="6 7"/>
            </g>
          </svg>'''
          write_text(brand_dir / "mailpin-hero.svg", hero_svg)

          board_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
            <title id="title">MailPin brand system</title><desc id="desc">MailPin logo, palette, typography and UI motifs.</desc>
            <rect width="1600" height="1000" fill="#F7F5F0"/>
            <g font-family="Inter,Segoe UI,system-ui,sans-serif">
              <text x="72" y="70" font-size="18" font-weight="700" letter-spacing="2" fill="#3D536B">MAILPIN BRAND SYSTEM</text>
              <line x1="72" y1="92" x2="1528" y2="92" stroke="#D7D3CA"/>
              <g transform="translate(80 155)">
                <g transform="scale(1.15)"><path fill="none" stroke="#1A1D21" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M16 53v51c0 5 4 8 9 8h78c5 0 9-3 9-8V53L78 79c-8 6-20 6-28 0L16 53Z"/><path fill="none" stroke="#1A1D21" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="m18 55 37 30c5 4 13 4 18 0l37-30"/><path fill="#4F7F75" fill-rule="evenodd" d="M64 8c-19 0-34 15-34 34 0 25 34 59 34 59s34-34 34-59C98 23 83 8 64 8Zm0 18a16 16 0 1 0 0 32 16 16 0 0 0 0-32Z"/></g>
                <text x="185" y="90" font-size="92" font-weight="650" fill="#1A1D21">MailPin</text>
                <text x="189" y="138" font-size="28" fill="#3D536B">Email Follow-up &amp; Productivity for Thunderbird</text>
              </g>
              <line x1="72" y1="350" x2="1528" y2="350" stroke="#D7D3CA"/>
              <text x="72" y="405" font-size="18" font-weight="700" letter-spacing="2" fill="#3D536B">PALETTE</text>
              <g transform="translate(72 445)">
                <g><rect width="240" height="118" rx="8" fill="#1A1D21"/><text y="150" font-size="18" fill="#1A1D21">Ink Charcoal · #1A1D21</text></g>
                <g transform="translate(278)"><rect width="240" height="118" rx="8" fill="#3D536B"/><text y="150" font-size="18" fill="#1A1D21">Slate Blue · #3D536B</text></g>
                <g transform="translate(556)"><rect width="240" height="118" rx="8" fill="#4F7F75"/><text y="150" font-size="18" fill="#1A1D21">Sage Teal · #4F7F75</text></g>
                <g transform="translate(834)"><rect width="240" height="118" rx="8" fill="#C79A3A"/><text y="150" font-size="18" fill="#1A1D21">Brass · #C79A3A</text></g>
                <g transform="translate(1112)"><rect width="240" height="118" rx="8" fill="#FFFFFF" stroke="#D7D3CA"/><text y="150" font-size="18" fill="#1A1D21">Warm White · #F7F5F0</text></g>
              </g>
              <line x1="72" y1="660" x2="1528" y2="660" stroke="#D7D3CA"/>
              <text x="72" y="715" font-size="18" font-weight="700" letter-spacing="2" fill="#3D536B">TYPE &amp; PRODUCT MOTIFS</text>
              <text x="72" y="815" font-size="76" font-weight="650" fill="#1A1D21">Aa</text>
              <text x="205" y="780" font-size="34" font-weight="650" fill="#1A1D21">System UI / Segoe UI Variable</text>
              <text x="205" y="820" font-size="22" fill="#5F696E">Readable. Calm. Intentional. Local-first.</text>
              <g transform="translate(860 735)">
                <rect width="610" height="150" rx="16" fill="#FFFFFF" stroke="#D7D3CA" stroke-width="2"/>
                <circle cx="48" cy="48" r="20" fill="#4F7F75"/><text x="88" y="55" font-size="24" font-weight="650" fill="#1A1D21">Follow up</text>
                <rect x="88" y="78" width="150" height="44" rx="22" fill="#F7F5F0" stroke="#C79A3A"/><text x="120" y="107" font-size="17" font-weight="600" fill="#9A6E17">Tomorrow</text>
                <rect x="280" y="31" width="285" height="88" rx="12" fill="#EEF3F1"/><text x="305" y="66" font-size="19" fill="#1A1D21">Notes · Tasks · Calendar</text><text x="305" y="95" font-size="17" fill="#3D536B">Focused follow-up workflow</text>
              </g>
              <text x="72" y="950" font-size="21" fill="#3D536B">No gradients · no remote assets · restrained color · strong contrast · Thunderbird-native geometry</text>
            </g>
          </svg>'''
          write_text(brand_dir / "mailpin-brand-board.svg", board_svg)

          # 7) Rebrand design tokens using an accessible, restrained no-gradient palette.
          tokens_path = ROOT / "extension/styles/tokens.css"
          tokens = tokens_path.read_text(encoding="utf-8")
          replacements = {
              "#0f6cbd": "#4f7f75", "#115ea3": "#426f67", "#0e4775": "#355b55",
              "#ebf3fc": "#e8f0ee", "#dcecff": "#d9e8e4", "#77b7e8": "#86aaa2",
              "#0e8f8f": "#3d536b", "#0b7777": "#31465a", "#087f7f": "#3d536b", "#e3f7f5": "#e9edf1",
              "#f7f9fa": "#f4f1ea", "#f0f4f6": "#eeeae2", "#e7edef": "#e5e0d7", "#f4f7fb": "#f7f5f0",
              "#17232b": "#1a1d21", "#4e626d": "#566066", "#657983": "#6f777b", "#d5e0e4": "#d7d3ca", "#e2e9eb": "#e7e2d9", "#71848d": "#737b7e", "#07577d": "#3d536b",
              "#479ef5": "#9bc3bb", "#62abf5": "#b0d0c9", "#0c3156": "#203a36", "#0f3d69": "#294741", "#2886de": "#5e8f86",
              "#123b3a": "#202c36", "#5bd6d1": "#aebdcc"
          }
          for old, new in replacements.items():
              tokens = tokens.replace(old, new)
          tokens = tokens.replace("MailPin Fluent 2 design tokens", "MailPin product design tokens")
          write_text(tokens_path, tokens)

          # 8) Current docs/version markers only. Historical audit/evidence files stay immutable.
          exact_version_files = [
              "THIRD_PARTY_NOTICES.md", "PROJECT_MEMORY.md", "PRIVACY.md", "SECURITY.md", "STORE_RELEASE.md",
              "docs/ATN_RELEASE_CHECKLIST.md", "docs/KNOWN_LIMITATIONS.md", "docs/MANUAL_TEST_PLAN.md", "docs/BUG_TRACKER.md",
              "docs/CODEX_HANDOFF.md", "release/ATN_REVIEW_NOTES_TEMPLATE.md", "release/BUILD_INSTRUCTIONS.md", "release/manifest-store-template.json"
          ]
          for rel in exact_version_files:
              path = ROOT / rel
              if path.is_file():
                  text = path.read_text(encoding="utf-8")
                  text = text.replace("1.5.4", VERSION)
                  write_text(path, text)

          # Project state JSON receives explicit current values.
          state_path = ROOT / "docs/PROJECT_STATE.json"
          if state_path.is_file():
              state = json.loads(state_path.read_text(encoding="utf-8"))
              for key in ("extensionVersion", "version"):
                  if key in state:
                      state[key] = VERSION
              raw = json.dumps(state, ensure_ascii=False, indent=2)
              raw = raw.replace(OLD_ID, NEW_ID).replace(INTERMEDIATE_ID, NEW_ID).replace(OLD_BRAND, BRAND)
              write_text(state_path, raw)

          # 9) Canonical branding document.
          branding = f'''# Identité de marque MailPin

## Identité canonique

- **Nom du produit :** MailPin
- **Nom complet pour le store :** MailPin — Email Follow-up & Productivity for Thunderbird
- **Baseline canonique :** Email Follow-up & Productivity for Thunderbird
- **Signature secondaire EN :** Stay on top. Follow through. Get results.
- **Signature secondaire FR :** Gardez le cap. Assurez le suivi. Avancez.
- **Dépôt :** `ussmarines/mailperch-thunderbird` (slug GitHub historique conservé tant qu’il n’est pas renommé dans les paramètres du dépôt)
- **Nom du paquet npm privé :** `mailpin-thunderbird`
- **Nom des builds :** `MailPin_v<VERSION>.xpi`
- **Nom des archives source :** `MailPin_GitHub_Repository_v<VERSION>.zip`

## Concept visuel

Le symbole combine une enveloppe et un repère/pin. Il représente le geste central du produit : sélectionner un e-mail, le garder à portée et le faire progresser dans un workflow de suivi.

La direction artistique est volontairement éditoriale et sobre : pas de dégradés, pas d’effets de verre, pas de glow, pas de texture générative. L’interface conserve la géométrie Thunderbird et utilise la marque comme système de hiérarchie, pas comme décoration.

## Palette

- **Ink Charcoal** `#1A1D21` — texte et structure.
- **Slate Blue** `#3D536B` — information secondaire et intégration Thunderbird.
- **Sage Teal** `#4F7F75` — action principale ; contraste AA avec texte blanc.
- **Sage Teal Dark** `#426F67` — hover/pressed et surfaces sombres.
- **Brass** `#C79A3A` — accent ponctuel pour rappel/attention, jamais texte blanc.
- **Warm Off-White** `#F7F5F0` — canvas clair.

Les valeurs runtime vivent dans `extension/styles/tokens.css`. Les thèmes clair, sombre, contraste forcé et réduction du mouvement restent pris en charge.

## Typographie

Pile locale uniquement : `system-ui`, `Segoe UI Variable`, `Aptos`, `Segoe UI`, sans-serif. Aucune police distante, CDN ou dépendance ajoutée.

## Assets canoniques

- `extension/icons/mailpin-icon.svg` — icône couleur scalable du module.
- `extension/icons/mailpin-icon-mono.svg` — variante monochrome.
- `assets/brand/mailpin-mark.svg` — marque vectorielle source.
- `assets/brand/mailpin-hero.svg` — bannière README/release.
- `assets/brand/mailpin-brand-board.svg` — planche de référence.

Thunderbird supporte les icônes SVG et les met à l’échelle pour les tailles du manifeste ; le manifeste déclare donc le même symbole SVG pour 16 à 128 px.

## Identifiants techniques

- **ID public définitif pour la première publication ATN :** `ussmarines.mailpin@addons.thunderbird.net`.
- Base locale historique : `pin-mails-v2.sqlite`.
- Préfixes DOM/CSS, formats import/export et API Experiment `pinInbox` restent stables pour limiter les migrations inutiles.

Le changement d’ID depuis `pin-mails@MailPerch.local` est volontaire et documenté dans `docs/IDENTITY_MIGRATION_REQUIRED.md`. Les builds GitHub antérieures n’étaient pas publiées sur ATN ; les installations locales existantes doivent sauvegarder/exporter puis réimporter leurs données.

## Métadonnées GitHub recommandées

- **Description :** MailPin — Email Follow-up & Productivity for Thunderbird.
- **Topics :** `thunderbird`, `mail-extension`, `email-productivity`, `email-follow-up`, `pinned-email`, `productivity`.

