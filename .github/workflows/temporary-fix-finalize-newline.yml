name: Temporary fix finalizer newline
on:
  push:
    branches:
      - design/organic-workspace-ui
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'chore(ui): stage temporary workflow newline fix' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/organic-workspace-ui
          fetch-depth: 0
      - name: Normalize temporary workflow newline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temporary-finalize-organic-audit.yml')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.rstrip('\n') + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-finalize-organic-audit.yml
          git diff --cached --check
          git commit -m "chore(ui): normalize temporary finalizer [temp-newline-fixed]"
          git push origin HEAD:design/organic-workspace-ui
