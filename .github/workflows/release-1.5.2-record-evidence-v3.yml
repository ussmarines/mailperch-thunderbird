name: Temporary record MailPerch 1.5.2 evidence

on:
  push:
    branches:
      - release/1.5.2-runtime-coverage
    paths:
      - .github/workflows/release-1.5.2-record-evidence-v3.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record validated evidence
        run: python scripts/_tmp_release_1_5_2_evidence.py
