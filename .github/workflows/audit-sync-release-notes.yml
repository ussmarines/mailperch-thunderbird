name: Temporary sync 1.5.1 release notes

on:
  push:
    branches: [audit/full-release-hardening-2026-08-10]
    paths: [.github/workflows/audit-sync-release-notes.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Update release notes from verified results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          anchor = '- smoke Thunderbird rattaché à `main` plutôt qu’à une ancienne branche de consolidation supprimée ;\n'
          addition = anchor + '- plage de compatibilité déclarée resserrée à Thunderbird `153.0`–`153.*` après essais réels : 128/140 injectent le panneau mais ne garantissent pas l’ouverture fiable du Dashboard via le pont MV3 Experiment → background ;\n- banc Thunderbird corrigé pour distinguer le total de portée des résultats filtrés, puis matrice réelle 50/100/500/1000/2000 revalidée sans timeout ni exception JavaScript sur Thunderbird 153.0.1 ESR ;\n'
          if addition not in s:
              if anchor not in s: raise SystemExit('CHANGELOG 1.5.1 anchor missing')
              p.write_text(s.replace(anchor, addition, 1))
          PY
          python scripts/check_versions.py
          git diff --check
      - name: Commit release-note synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: finalize 1.5.1 release notes"
          git push origin HEAD:audit/full-release-hardening-2026-08-10
