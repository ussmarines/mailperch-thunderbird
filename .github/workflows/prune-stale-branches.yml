# One-shot branch-only cleanup; never merged to main.
name: One-shot prune stale branches

on:
  push:
    branches:
      - ops/prune-stale-branches

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded release and diagnostic branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "ops/inspect-finalize175"
            "ops/inspect-release175"
            "ops/verify-release175-final"
            "release/atn-name-1.7.5"
            "release/publish-1.7.5"
          )

          for branch in "${branches[@]}"; do
            endpoint="repos/${GH_REPO}/git/refs/heads/${branch}"
            if gh api "$endpoint" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api -X DELETE "$endpoint"
            else
              echo "Already absent: ${branch}"
            fi
          done

          for branch in "${branches[@]}"; do
            endpoint="repos/${GH_REPO}/git/refs/heads/${branch}"
            if gh api "$endpoint" >/dev/null 2>&1; then
              echo "Branch still exists after cleanup: ${branch}" >&2
              exit 1
            fi
          done

          echo "Deleting one-shot branch last"
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/ops/prune-stale-branches"
          echo "Stale branch pruning complete."
