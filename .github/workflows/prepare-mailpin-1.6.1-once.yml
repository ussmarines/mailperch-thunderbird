name: Temporary MailPin 1.6.1 metadata preparation

on:
  push:
    branches:
      - "release/mailpin-1.6.1-store-metadata"

permissions:
  contents: write

concurrency:
  group: mailpin-1-6-1-metadata-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: release/mailpin-1.6.1-store-metadata
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply 1.6.1 metadata correction
        run: python scripts/prepare_mailpin_1_6_1_once.py
      - name: Targeted release metadata guards
        run: |
          python scripts/check_versions.py
          python scripts/check_repo.py
          python tests/test_project_metadata.py
          python tests/static_checks.py
      - name: Stage candidate tree for index-aware guards
        run: |
          git add -A
          git diff --cached --check
      - name: Full release gate
        run: npm run ci
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git status --short
          git commit -m "docs(release): prepare MailPin 1.6.1 ATN metadata"
          git push origin HEAD:release/mailpin-1.6.1-store-metadata
