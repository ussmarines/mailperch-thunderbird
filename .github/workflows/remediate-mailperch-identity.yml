name: Temporary MailPerch identity remediation

on:
  push:
    branches:
      - security/remediate-mailperch-audit

permissions:
  contents: write

concurrency:
  group: mailperch-identity-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Replace only hashed current-tree identity matches
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          from pathlib import Path
          import re
          import sys
          import unicodedata

          module_path = Path(".github/scripts/security_guard.py")
          spec = importlib.util.spec_from_file_location("security_guard", module_path)
          assert spec and spec.loader
          guard = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = guard
          spec.loader.exec_module(guard)

          targets = {
              Path("BRANDING.md"): {28},
              Path("LICENSE"): {2, 5},
              Path("NOTICE.md"): {3},
              Path("STORE_RELEASE.md"): {11},
              Path("docs/DECISIONS.md"): {5},
              Path("release/ATN_REVIEW_NOTES_TEMPLATE.md"): {8},
          }

          word_re = re.compile(r"[^\W_]+", re.UNICODE)

          def normalized_token(value: str) -> str:
              normalized = unicodedata.normalize("NFKD", value)
              return normalized.encode("ascii", "ignore").decode("ascii").lower()

          def replacement_spans(line: str) -> list[tuple[int, int]]:
              words = []
              for match in word_re.finditer(line):
                  token = normalized_token(match.group(0))
                  if token:
                      words.append((match.start(), match.end(), token))
              candidates = []
              for start in range(len(words)):
                  for size in (3, 2, 1):
                      end = start + size
                      if end > len(words):
                          continue
                      candidate = "".join(item[2] for item in words[start:end])
                      digest = hashlib.sha256(candidate.encode()).hexdigest()
                      if digest in guard.FORBIDDEN_IDENTITY_HASHES:
                          candidates.append((words[start][0], words[end - 1][1]))
                          break
              selected = []
              for span in sorted(candidates, key=lambda item: (item[0], -(item[1] - item[0]))):
                  if any(not (span[1] <= old[0] or span[0] >= old[1]) for old in selected):
                      continue
                  selected.append(span)
              return sorted(selected)

          changed = []
          for path, line_numbers in targets.items():
              original = path.read_text(encoding="utf-8")
              newline = "\r\n" if "\r\n" in original else "\n"
              lines = original.splitlines()
              for number in sorted(line_numbers):
                  index = number - 1
                  line = lines[index]
                  if not guard.identity_match(guard.tokens(line)):
                      raise SystemExit(f"{path}:{number}: expected hashed identity match was not found")
                  spans = replacement_spans(line)
                  if not spans:
                      raise SystemExit(f"{path}:{number}: no safe replacement span could be derived")
                  for start, end in reversed(spans):
                      line = line[:start] + "ussmarines" + line[end:]
                  if guard.identity_match(guard.tokens(line)):
                      raise SystemExit(f"{path}:{number}: identity match remains after replacement")
                  lines[index] = line
              updated = newline.join(lines) + (newline if original.endswith(("\n", "\r\n")) else "")
              if updated == original:
                  raise SystemExit(f"{path}: expected a change but none was produced")
              path.write_text(updated, encoding="utf-8", newline="")
              changed.append(str(path))

          print("Remediated tracked identity locations:")
          for path in changed:
              print(f"- {path}")
          PY

      - name: Verify current tree
        run: |
          python3 .github/scripts/security_guard.py
          git diff --check

      - name: Remove temporary workflow
        run: rm .github/workflows/remediate-mailperch-identity.yml

      - name: Commit remediation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            BRANDING.md \
            LICENSE \
            NOTICE.md \
            STORE_RELEASE.md \
            docs/DECISIONS.md \
            release/ATN_REVIEW_NOTES_TEMPLATE.md \
            .github/workflows/remediate-mailperch-identity.yml
          git diff --cached --check
          git commit -m "security: replace current private identity references"
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
