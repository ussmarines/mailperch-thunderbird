name: Apply MailPerch import hardening

on:
  push:
    branches:
      - fix/import-safe-mode-hardening

permissions:
  contents: write

concurrency:
  group: mailperch-import-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply validated security patch and publish final branch state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin main:refs/remotes/origin/main
          git apply --check .mailperch-import-hardening.patch
          git apply .mailperch-import-hardening.patch
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -- .mailperch-import-hardening.patch
          python tests/test_security_hardening_3_2_4.py
          python tests/test_data_integrity_guards.py
          python tests/static_checks.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- extension/api/pinInbox/implementation.js tests/test_security_hardening_3_2_4.py .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "fix(security): harden imported automation settings"
          git push origin HEAD:${GITHUB_REF}
