name: Temporary fix selected-account search bench

on:
  push:
    branches: [audit/full-release-hardening-2026-08-10]
    paths: [.github/workflows/audit-fix-selected-search-bench.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch the incorrect search-count assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bench = Path('tests/thunderbird/functional_bench.py')
          source = bench.read_text()
          old = '''      const searchExpected = Number(scopeExpected.searchCount || 0);\n      await waitFor(() => count() === searchExpected, `selected-account search count ${searchable}`);\n      while (cards().length < searchExpected && list.querySelector(".pin-mails-load-more")) {\n        list.querySelector(".pin-mails-load-more").click();\n        await sleep(30);\n      }\n      await waitFor(() => cards().length === searchExpected, `selected-account search ${searchable}`, 60000);'''
          new = '''      const searchExpected = Number(scopeExpected.searchCount || 0);\n      await waitFor(\n        () => searchExpected === 0\n          ? cards().length === 0\n          : cards().length > 0 && cards().every(card => card.textContent.includes(`Scope-${searchable}`)),\n        `selected-account search rendered ${searchable}`\n      );\n      await waitFor(\n        () => count() === expectedScopes.selectedAccounts,\n        "selected-account total preserved during search"\n      );\n      while (cards().length < searchExpected && list.querySelector(".pin-mails-load-more")) {\n        list.querySelector(".pin-mails-load-more").click();\n        await sleep(30);\n      }\n      await waitFor(() => cards().length === searchExpected, `selected-account search ${searchable}`, 60000);'''
          if old not in source:
              raise SystemExit('functional bench assertion anchor missing')
          bench.write_text(source.replace(old, new, 1))

          guard = Path('tests/test_thunderbird_test_bench.py')
          source = guard.read_text()
          old = '''assert "const searchExpected = Number(scopeExpected.searchCount || 0);" in BENCH\nassert 'while (cards().length < searchExpected && list.querySelector(".pin-mails-load-more"))' in BENCH\nassert "selected-account search count ${searchable}" in BENCH'''
          new = '''assert "const searchExpected = Number(scopeExpected.searchCount || 0);" in BENCH\nassert 'while (cards().length < searchExpected && list.querySelector(".pin-mails-load-more"))' in BENCH\nassert "selected-account search rendered ${searchable}" in BENCH\nassert "selected-account total preserved during search" in BENCH\nassert "selected-account search count ${searchable}" not in BENCH'''
          if old not in source:
              raise SystemExit('bench guard anchor missing')
          guard.write_text(source.replace(old, new, 1))
          PY
      - name: Targeted validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/thunderbird/functional_bench.py
          python tests/test_thunderbird_test_bench.py
          git diff --check
      - name: Commit targeted fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/thunderbird/functional_bench.py tests/test_thunderbird_test_bench.py
          git commit -m "test: fix selected-account search bench assertion"
          git push origin HEAD:audit/full-release-hardening-2026-08-10
