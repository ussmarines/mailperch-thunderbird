name: Finalize MailPin 1.7.5 published state

on:
  push:
    branches:
      - release/finalize-1.7.5
    paths:
      - ".github/workflows/finalize-1.7.5.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare final published state
        run: python scripts/finalize_1_7_5_release.py

      - name: Remove temporary release automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-1.7.5.yml
          rm -f .github/workflows/finalize-1.7.5.yml
          rm -f scripts/finalize_1_7_5_release.py

      - name: Verify final published state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_versions.py
          python scripts/check_project_memory.py
          python scripts/check_bug_tracker.py
          npm run ci
          test ! -e .github/workflows/release-1.7.5.yml
          test ! -e .github/workflows/finalize-1.7.5.yml
          test ! -e scripts/finalize_1_7_5_release.py
          grep -F 'release-v1.7.5' README.md
          grep -F 'release-v1.7.5' README.en.md
          grep -F 'MailPin_v1.7.5.xpi' README.md
          grep -F 'MailPin_v1.7.5.xpi' README.en.md

      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git status --short
          git add -u
          git add -- \
            README.md README.en.md PROJECT_MEMORY.md STORE_RELEASE.md \
            SECURITY_AUDIT_1.7.5.md VALIDATION_REPORT_1.7.5.md \
            docs/PROJECT_STATE.json docs/ATN_RELEASE_CHECKLIST.md docs/BUG_TRACKER.md \
            docs/KNOWN_LIMITATIONS.md docs/MANUAL_TEST_PLAN.md docs/CODEX_HANDOFF.md \
            docs/AI_VALIDATION_STATE.json release/BUILD_INSTRUCTIONS.md \
            release/ATN_REVIEW_NOTES_TEMPLATE.md release/manifest-store-template.json \
            release/ATN_SUBMISSION_1.7.5.md
          git commit -m 'docs(release): finalize MailPin 1.7.5 publication'
          git push origin HEAD:release/finalize-1.7.5
