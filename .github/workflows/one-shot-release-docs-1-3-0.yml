name: One-shot MailPerch 1.3.0 release documentation sync

on:
  push:
    branches:
      - refactor/thunderbird-integration-and-ux
    paths:
      - ".github/workflows/one-shot-release-docs-1-3-0.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Synchronize 1.3.0 publication documents
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrence(s), got {count}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{path}: replaced {count} occurrence(s)")

          # These files describe the release being published, not historical versions.
          for path in (
              "STORE_RELEASE.md",
              "docs/ATN_RELEASE_CHECKLIST.md",
              "release/ATN_REVIEW_NOTES_TEMPLATE.md",
              "release/BUILD_INSTRUCTIONS.md",
              "release/manifest-store-template.json",
          ):
              replace_all(path, "1.2.1", "1.3.0")

          # Privacy guarantee is the current shipped product guarantee.
          replace_all("PRIVACY.md", "MailPerch 1.2.1", "MailPerch 1.3.0", minimum=2)

          # Manual command in the runtime bench must point to the current build artifact.
          replace_once(
              "docs/THUNDERBIRD_TEST_BENCH.md",
              "--xpi dist/MailPerch_v1.2.1.xpi",
              "--xpi dist/MailPerch_v1.3.0.xpi",
          )

          # Preserve the historical 1.2.1 user test while describing 1.3.0 as the release candidate.
          replace_once(
              "docs/MANUAL_TEST_PLAN.md",
              "# Plan de test manuel MailPerch — 1.2.1 et branche de consolidation",
              "# Plan de test manuel MailPerch — 1.3.0",
          )
          replace_once(
              "docs/MANUAL_TEST_PLAN.md",
              "La version publique 1.2.1 a déjà fait l’objet le 8 août 2026 d’une passe utilisateur réelle sans anomalie signalée. Le présent plan sert surtout à valider la future release issue de `refactor/thunderbird-integration-and-ux` et à couvrir les zones modifiées.",
              "La version 1.2.1 a déjà fait l’objet le 8 août 2026 d’une passe utilisateur réelle sans anomalie signalée. Le présent plan sert à valider la release 1.3.0 issue de `refactor/thunderbird-integration-and-ux` et à couvrir les zones modifiées.",
          )

          replace_once(
              "docs/KNOWN_LIMITATIONS.md",
              "## Version publique et branche de consolidation",
              "## Version 1.3.0 et portée de validation",
          )
          replace_once(
              "docs/KNOWN_LIMITATIONS.md",
              "La version publique reste **1.2.1**. L’utilisateur a effectué le 8 août 2026 une passe réelle de la 1.2.1 sur son Thunderbird sans anomalie signalée. Cette observation est une validation utile du fonctionnement courant, mais elle ne remplace pas une matrice exhaustive par système, version, fournisseur, type de dossier et calendrier.",
              "La version **1.3.0** livre la consolidation Thunderbird et Options. L’utilisateur a effectué le 8 août 2026 une passe réelle de la 1.2.1 sur son Thunderbird sans anomalie signalée ; la 1.3.0 bénéficie en plus des validations automatisées, de la revue Codex et du smoke Thunderbird 153.0.1 ESR. Cela ne remplace pas une matrice exhaustive par système, version, fournisseur, type de dossier et calendrier.",
          )
          replace_once(
              "docs/KNOWN_LIMITATIONS.md",
              "La branche `refactor/thunderbird-integration-and-ux` modifie l’architecture interne et les Options. Tant qu’elle n’a pas été revue, exécutée par la CI GitHub puis publiée, elle ne doit pas être assimilée à la 1.2.1 stable.",
              "La branche `refactor/thunderbird-integration-and-ux` a été revue par Codex et validée par la CI GitHub ainsi que par le smoke Thunderbird réel. Les scénarios fournisseurs/OS/zoom/accessibilité qui restent manuels sont détaillés ci-dessous et doivent être distingués de cette validation automatisée.",
          )

          # Roadmap: close the consolidation engineering/review work while keeping real-user 1.3.0 testing pending.
          replace_once("ROADMAP.md", "## En cours — consolidation post-1.2.1", "## 1.3.0 — consolidation Thunderbird et interface")
          replace_once(
              "ROADMAP.md",
              "- [ ] exécuter la passe finale `npm run ci` et l’audit du diff ;",
              "- [x] exécuter la passe finale `npm run ci` et l’audit du diff ;",
          )
          replace_once(
              "ROADMAP.md",
              "- [ ] synchroniser la branche GitHub et obtenir QA/CodeQL/smoke verts ;",
              "- [x] synchroniser la branche GitHub et obtenir QA/smoke verts ; CodeQL reste le gate de PR ;",
          )
          replace_once(
              "ROADMAP.md",
              "- [ ] faire relire/corriger la branche par Codex avec les outils choisis par l’utilisateur ;",
              "- [x] faire relire/corriger la branche par Codex avec Thunderbird, Fluent 2, Playwright, Context7 et Security Diff Scan ;",
          )
          replace_once(
              "ROADMAP.md",
              "- [ ] seulement ensuite préparer PR, fusion et nouvelle release.",
              "- [x] préparer la release 1.3.0 ; PR, CodeQL, fusion et publication constituent les derniers gates GitHub.",
          )

      - name: Validate synchronized release documentation
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool release/manifest-store-template.json >/dev/null
          npm run ci
          git diff --check
          git diff --exit-code -- .github/workflows/one-shot-release-docs-1-3-0.yml

      - name: Commit documentation sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRIVACY.md ROADMAP.md STORE_RELEASE.md docs/ATN_RELEASE_CHECKLIST.md docs/KNOWN_LIMITATIONS.md docs/MANUAL_TEST_PLAN.md docs/THUNDERBIRD_TEST_BENCH.md release/ATN_REVIEW_NOTES_TEMPLATE.md release/BUILD_INSTRUCTIONS.md release/manifest-store-template.json
          git commit -m "docs(release): align MailPerch 1.3.0 publication files"
          git push origin HEAD:refs/heads/refactor/thunderbird-integration-and-ux
