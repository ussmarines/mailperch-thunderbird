name: Audit source export

on:
  push:
    branches:
      - audit/full-release-hardening-2026-08-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive tracked source
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/mailperch-audit-source.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-source
          path: /tmp/mailperch-audit-source.tgz
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
