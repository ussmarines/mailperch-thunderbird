name: Organic Workspace branch validation

on:
  push:
    branches:
      - "design/organic-workspace-ui"

permissions:
  contents: write

concurrency:
  group: mailpin-organic-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout design branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Synchronize canonical repository references
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = "ussmarines/mailperch-thunderbird"
          new = "ussmarines/mailpin-thunderbird"
          names = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in names:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              try:
                  value = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              if old in value:
                  path.write_text(value.replace(old, new), encoding="utf-8", newline="\n")

          readme = Path("README.md")
          fr = readme.read_text(encoding="utf-8")
          old_fr = "La 1.6.0 inaugure l’identité **MailPin** : symbole enveloppe + pin, palette Ink / Slate / Sage / Brass, canvas chaud, typographie locale et accents sobres. Aucun dégradé ni asset distant. Les thèmes clair/sombre, le contraste forcé, le focus clavier et la réduction du mouvement restent pris en charge."
          new_fr = "La branche **Organic Workspace** reconstruit l’interface comme un véritable espace de travail : rail de navigation, canvas éditorial, contexte secondaire, panneaux plus organiques et micro-interactions fonctionnelles. La palette Ink / Slate / Sage / Brass évolue vers des tons plus naturels et une typographie locale plus expressive. Aucun dégradé, glow, glassmorphism, asset ou police distante. Les thèmes clair/sombre, le contraste forcé, le focus clavier et la réduction du mouvement restent pris en charge."
          if old_fr in fr:
              readme.write_text(fr.replace(old_fr, new_fr, 1), encoding="utf-8", newline="\n")

          readme_en = Path("README.en.md")
          en = readme_en.read_text(encoding="utf-8")
          old_en = "Version 1.6.0 introduces the **MailPin** identity: envelope + pin mark, Ink / Slate / Sage / Brass palette, warm canvas, local typography and restrained accents. No gradients or remote assets. Light/dark themes, forced contrast, keyboard focus and reduced motion remain supported."
          new_en = "The **Organic Workspace** branch rebuilds the interface as a true working environment: navigation rail, editorial canvas, secondary context, more organic surfaces, and functional micro-interactions. The Ink / Slate / Sage / Brass palette shifts toward more natural tones with more expressive local typography. No gradients, glow, glassmorphism, remote assets, or remote fonts. Light/dark themes, forced contrast, keyboard focus, and reduced motion remain supported."
          if old_en in en:
              readme_en.write_text(en.replace(old_en, new_en, 1), encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Targeted Organic Workspace contracts
        run: |
          python tests/test_organic_workspace_ui.py
          python tests/test_ui_regressions.py
          python tests/test_ui_polish_3_2_3.py
          python tests/test_project_metadata.py
          python tests/test_accessibility_localization.py
          python tests/test_dashboard_dom_contract.py
          python tests/test_options_controls.py
          python tests/test_recommended_options_ux.py
          python tests/test_dynamic_options_localization.py
          node tests/dashboard_browser_test_contract.mjs
          node tests/options_browser_test_contract.mjs

      - name: Full release-equivalent CI
        run: npm run ci

      - name: Commit post-transform consistency delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No consistency delta to commit."
            exit 0
          fi
          git commit -m "docs: align Organic Workspace and repository metadata"
          git push origin HEAD:design/organic-workspace-ui
