name: One-shot consolidation docs finalization

on:
  push:
    branches:
      - refactor/thunderbird-integration-and-ux
    paths:
      - ".github/workflows/one-shot-docs-finalize.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Synchronize consolidation evidence and handoff
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, got {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "PROJECT_MEMORY.md",
              "13. Le mode **Recommandé** prépare des valeurs sûres mais ne sauvegarde jamais automatiquement ; Enregistrer/Annuler restent explicites.\n",
              "13. Le mode **Recommandé** prépare des valeurs sûres mais ne sauvegarde jamais automatiquement ; Enregistrer/Annuler restent explicites.\n14. Toute classe ou service privilégié injecté dans `PinCompatibility` doit être importé/défini explicitement avant la création des adaptateurs ; aucun identifiant global implicite ne doit être requis au bootstrap.\n",
          )
          replace_once(
              "PROJECT_MEMORY.md",
              "Le workflow `.github/workflows/thunderbird-smoke.yml` télécharge un binaire Thunderbird officiel et geckodriver, vérifie leurs empreintes, construit l’XPI, l’installe temporairement, contrôle l’injection du panneau, désinstalle, contrôle le nettoyage puis réinstalle. Son code est validé localement, mais un résultat runtime n’est acquis qu’après exécution réussie du workflow sur GitHub.\n",
              "Le workflow `.github/workflows/thunderbird-smoke.yml` télécharge un binaire Thunderbird officiel et geckodriver, vérifie leurs empreintes, construit l’XPI, prépare un profil local synthétique, installe temporairement l’extension, contrôle le background MV3 et l’injection, désinstalle, contrôle le nettoyage puis réinstalle. Le 8 août 2026, ce cycle a réussi sur Thunderbird **153.0.1 ESR** Linux : `Startup: Complete`, un panneau, un bouton, nettoyage complet puis réinjection unique. Le banc a auparavant détecté un crash réel `ExtensionError is not defined`, corrigé par un import explicite depuis `ExtensionUtils.sys.mjs` et protégé par une garde. Cette preuve ne couvre pas la matrice fournisseurs/OS/versions.\n",
          )

          replace_once(
              "docs/CODEX_HANDOFF.md",
              "Le stockage garde `uxMode = guided|advanced`. L’interface affiche **Recommandé** pour `guided`.\n",
              "Le stockage garde `settingsExperience = guided|advanced`. L’interface affiche **Recommandé** pour `guided`.\n",
          )
          replace_once(
              "docs/CODEX_HANDOFF.md",
              "- le smoke installe/désinstalle/réinstalle l’XPI et contrôle l’injection/cleanup du panneau.\n\nNe jamais déduire qu’il est compatible avec toutes les versions/fournisseurs à partir d’un seul smoke Linux.\n",
              "- le smoke installe/désinstalle/réinstalle l’XPI et contrôle l’injection/cleanup du panneau ;\n- exécution réelle réussie le 8 août 2026 sur Thunderbird **153.0.1 ESR** Linux avec profil Local Folders synthétique : background `Startup: Complete`, panneau/bouton injectés une seule fois, cleanup complet, réinstallation propre.\n\nLe banc a détecté pendant cette branche un crash de bootstrap `ReferenceError: ExtensionError is not defined` provoqué par l’injection immédiate d’une dépendance privilégiée jusque-là implicite. La correction importe explicitement `ExtensionError` depuis `ExtensionUtils.sys.mjs`; `tests/test_thunderbird_compatibility_boundary.py` garde cet invariant. Ne pas retirer cet import ni assouplir le smoke sans cause démontrée.\n\nNe jamais déduire qu’il est compatible avec toutes les versions/fournisseurs à partir d’un seul smoke Linux.\n",
          )

          replace_once(
              "ROADMAP.md",
              "- [ ] exécuter et stabiliser le smoke runtime sur un vrai binaire Thunderbird via GitHub Actions ;",
              "- [x] exécuter et stabiliser le smoke runtime sur Thunderbird 153.0.1 ESR Linux avec profil local synthétique, installation/cleanup/réinstallation validés ;",
          )

          replace_once(
              "docs/KNOWN_LIMITATIONS.md",
              "- Le workflow `.github/workflows/thunderbird-smoke.yml` lance un binaire Thunderbird officiel et contrôle installation, injection, désinstallation/cleanup et réinstallation. **Il ne doit être considéré comme une preuve runtime qu’après une exécution GitHub réellement réussie.**\n",
              "- Le workflow `.github/workflows/thunderbird-smoke.yml` a réussi le 8 août 2026 sur Thunderbird **153.0.1 ESR** Linux avec un profil Local Folders synthétique : installation, background `Startup: Complete`, injection unique, désinstallation/cleanup et réinstallation propre ont été observés. Cette preuve est limitée à ce scénario local sans fournisseur réseau.\n",
          )

          replace_once(
              "docs/THUNDERBIRD_COMPATIBILITY.md",
              "`PinCompatibility.create(dependencies)` reçoit explicitement les services privilégiés. Cette injection a deux buts :\n\n- rendre les dépendances Thunderbird visibles à un seul endroit ;\n- permettre aux tests Node de fournir des faux services déterministes sans démarrer Thunderbird.\n",
              "`PinCompatibility.create(dependencies)` reçoit explicitement les services privilégiés. Cette injection a deux buts :\n\n- rendre les dépendances Thunderbird visibles à un seul endroit ;\n- permettre aux tests Node de fournir des faux services déterministes sans démarrer Thunderbird.\n\nToute dépendance privilégiée injectée doit elle-même être importée ou définie explicitement **avant** la création de la façade. La branche a démontré pourquoi : rendre `ExtensionError` immédiatement nécessaire a révélé un identifiant global implicite et provoqué un crash de bootstrap réel. `ExtensionError` est désormais importé depuis `ExtensionUtils.sys.mjs` et une garde protège ce contrat.\n",
          )
          replace_once(
              "docs/THUNDERBIRD_COMPATIBILITY.md",
              "Toute future adaptation de version doit rester localisée autant que possible dans ces adaptateurs et être documentée dans `docs/KNOWN_LIMITATIONS.md` et `docs/BUG_TRACKER.md` si elle corrige une régression observée.\n",
              "Toute future adaptation de version doit rester localisée autant que possible dans ces adaptateurs et être documentée dans `docs/KNOWN_LIMITATIONS.md` et `docs/BUG_TRACKER.md` si elle corrige une régression observée.\n\n### Preuve runtime actuelle\n\nLe 8 août 2026, le banc réel a validé Thunderbird **153.0.1 ESR** Linux sur un profil local synthétique : vue `about:3pane` prête, Experiment/background à `Startup: Complete`, panneau et bouton injectés une seule fois, nettoyage après désinstallation, puis réinstallation sans duplication. Cela valide le bootstrap et le cycle de vie de la frontière sur cette version, pas les fournisseurs réels ni toute la plage 128–153.\n",
          )

          replace_once(
              "docs/BUG_TRACKER.md",
              "| MP-2026-019 | 1.1.1 |",
              "| MP-2026-021 | consolidation post-1.2.1 | L’Experiment échoue au démarrage dans le smoke réel avec `ReferenceError: ExtensionError is not defined`; aucun panneau n’est injecté. | La nouvelle façade évalue immédiatement `ExtensionError`, ancien identifiant implicite utilisé seulement dans certains chemins d’erreur. | `extension/api/pinInbox/implementation.js` | `tests/test_thunderbird_compatibility_boundary.py`, smoke Thunderbird réel | CORRIGÉ | branche de consolidation | Import explicite depuis `ExtensionUtils.sys.mjs`; Thunderbird 153.0.1 ESR atteint `Startup: Complete`, injection unique, cleanup et réinstallation validés le 8 août 2026. |\n| MP-2026-019 | 1.1.1 |",
          )

          replace_once(
              "CHANGELOG.md",
              "- ajout d’un smoke runtime GitHub Actions basé sur un binaire Thunderbird officiel et geckodriver vérifiés par SHA-256 ;\n",
              "- ajout d’un smoke runtime GitHub Actions basé sur un binaire Thunderbird officiel et geckodriver vérifiés par SHA-256 ; exécution réelle réussie sur Thunderbird 153.0.1 ESR avec profil local synthétique, injection/cleanup/réinstallation contrôlés ;\n- correction d’un crash de bootstrap découvert par ce banc (`ExtensionError is not defined`) grâce à un import privilégié explicite et une garde de non-régression ;\n",
          )

          replace_once(
              "docs/ARCHITECTURE.md",
              "Le workflow runtime reste séparé de la QA obligatoire tant que son comportement n’a pas été éprouvé. Un résultat local ou un test de contrat ne doit jamais être présenté comme une validation graphique Thunderbird.\n",
              "Le workflow runtime reste séparé de la QA obligatoire même après sa première exécution réussie sur Thunderbird 153.0.1 ESR : il doit accumuler plusieurs exécutions fiables avant une éventuelle promotion en contrôle requis. Un test de contrat ne doit jamais être présenté comme une validation graphique Thunderbird.\n",
          )

          state_path = Path("docs/PROJECT_STATE.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          invariant = "Privileged dependencies injected into compatibility adapters are explicitly imported before facade creation"
          if invariant not in state["invariants"]:
              state["invariants"].append(invariant)
          state["testing"]["runtimeStatus"] = (
              "passed on 2026-08-08 with Thunderbird 153.0.1 ESR Linux and a synthetic Local Folders profile; "
              "MV3 Startup Complete, single injection, uninstall cleanup and clean reinstall validated; provider/OS/version matrix remains manual"
          )
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

      - name: Validate documentation and state
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool docs/PROJECT_STATE.json >/dev/null
          python scripts/check_project_memory.py
          python scripts/check_bug_tracker.py
          python tests/test_project_metadata.py
          git diff --check
          git diff --exit-code -- .github/workflows/one-shot-docs-finalize.yml

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_MEMORY.md CHANGELOG.md ROADMAP.md docs/
          git commit -m "docs: finalize Thunderbird consolidation evidence"
          git push origin HEAD:refs/heads/refactor/thunderbird-integration-and-ux
