name: Temporary final full security audit

on:
  push:
    branches: [audit/full-release-hardening-2026-08-10]
    paths: [.github/workflows/audit-security-final.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare reports
        run: mkdir -p .security-reports
      - name: Full-history identity guard
        run: python3 .github/scripts/security_guard.py --history --report .security-reports/identity-guard.json
      - name: Install and run verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config=.gitleaks.toml --log-opts="--all" --redact=100 --exit-code=2 --report-format=json --report-path=.security-reports/gitleaks.json
      - name: Install and run verified Opengrep 1.22.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/opengrep/opengrep/releases/download/v1.22.0/opengrep_manylinux_x86" -o "$RUNNER_TEMP/opengrep"
          echo "45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319  $RUNNER_TEMP/opengrep" | sha256sum -c --strict
          chmod 0755 "$RUNNER_TEMP/opengrep"
          "$RUNNER_TEMP/opengrep" scan --config .security/opengrep/project-security.yml --json-output .security-reports/opengrep.json --error --exclude node_modules --exclude vendor --exclude dist --exclude coverage .
      - name: Install verified Trivy 0.70.0
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v0.70.0"
          curl -fsSL "$base/trivy_0.70.0_checksums.txt" -o checksums.txt
          echo "c45281240bb9211ea9e830fc0bf5cf8acf7c0ca830feb64ac8a0aa932c5c92d9  checksums.txt" | sha256sum -c --strict
          asset="$(awk '$2 ~ /Linux-64bit\.tar\.gz$/ {print $2; exit}' checksums.txt)"
          test -n "$asset"
          curl -fsSL "$base/$asset" -o "$asset"
          grep "  $asset$" checksums.txt | sha256sum -c --strict
          tar -xzf "$asset" trivy
          install -m 0755 trivy "$RUNNER_TEMP/trivy"
      - name: Trivy vulnerabilities and configuration
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy" filesystem --scanners vuln,misconfig --severity MEDIUM,HIGH,CRITICAL --format json --output .security-reports/trivy.json --exit-code 1 .
      - name: CycloneDX SBOM
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy" filesystem --scanners vuln --format cyclonedx --output .security-reports/sbom.cdx.json .
      - name: Install and run verified zizmor 1.26.1 offline
        shell: bash
        run: |
          set -euo pipefail
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v1.26.1/$archive" -o "$archive"
          echo "8556289a64e7aaf2400cd516f61a471aa91c5902cc56ad96a82fd12f90c2ef73  $archive" | sha256sum -c --strict
          binary_path="$(tar -tzf "$archive" | awk '/(^|\/)zizmor$/ {print; exit}')"
          test -n "$binary_path"
          tar -xzf "$archive" "$binary_path"
          install -m 0755 "$binary_path" "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor" --offline --format json . > .security-reports/zizmor.json
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-security-audit
          path: .security-reports/
          retention-days: 1
          include-hidden-files: true
