name: Temporary QoL applicator

on:
  push:
    branches:
      - design/organic-workspace-ui
    paths:
      - .github/workflows/qol-audit-temp.yml

permissions:
  contents: write

jobs:
  apply-qol:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/organic-workspace-ui
          fetch-depth: 1

      - name: Apply QoL corrections
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/qol_apply_temp.py
          node --check extension/options/options.js
          node --check extension/api/pinInbox/implementation.js
          python tests/test_organic_workspace_ui.py
          python tests/test_options_controls.py
          python tests/test_calendar_and_card_actions.py
          python tests/test_recommended_options_ux.py
          python tests/test_data_integrity_guards.py
          node tests/settings_defaults.mjs
          git diff --check

      - name: Commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            extension/api/pinInbox/implementation.js \
            extension/options/options.js \
            docs/UI_SPEC.md \
            tests/test_organic_workspace_ui.py
          git diff --cached --check
          git commit -m "fix(qol): improve defaults and creation flow"
          git push origin HEAD:design/organic-workspace-ui
