name: Prepare MailPin 1.7.5 ATN name fix

on:
  push:
    branches:
      - release/atn-name-1.7.5
    paths:
      - ".github/workflows/prepare-1.7.5.yml"

permissions:
  contents: write

concurrency:
  group: mailpin-prepare-1-7-5
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply bounded 1.7.5 metadata fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          old_name = 'MailPin — Email Follow-up & Productivity for Thunderbird'
          new_name = 'MailPin — Email Follow-up & Productivity'
          assert len(old_name) == 56
          assert len(new_name) == 40
          assert len(new_name) <= 50

          for rel in [
              'extension/_locales/en/messages.json',
              'extension/_locales/fr/messages.json',
              'package.json',
              'README.md',
              'README.en.md',
              'BRANDING.md',
              'release/ATN_REVIEW_NOTES_TEMPLATE.md',
              'docs/IDENTITY_MIGRATION_REQUIRED.md',
              'docs/DECISIONS.md',
              'docs/PROJECT_STATE.json',
              'scripts/check_repo.py',
              'tests/static_checks.py',
          ]:
              path = root / rel
              text = path.read_text(encoding='utf-8')
              if old_name in text:
                  text = text.replace(old_name, new_name)
                  path.write_text(text, encoding='utf-8')

          manifest_path = root / 'extension/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['version'] == '1.7.4'
          assert manifest['browser_specific_settings']['gecko']['id'] == 'ussmarines.mailpin@addons.thunderbird.net'
          assert manifest['browser_specific_settings']['gecko']['strict_min_version'] == '153.0'
          assert manifest['browser_specific_settings']['gecko']['strict_max_version'] == '154.*'
          manifest['version'] = '1.7.5'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          assert package['version'] == '1.7.4'
          package['version'] = '1.7.5'
          package['description'] = 'Build, test, and release tooling for MailPin — Email Follow-up & Productivity.'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          check_repo_path = root / 'scripts/check_repo.py'
          text = check_repo_path.read_text(encoding='utf-8')
          old_block = '''check(fr_locale.get("extensionName", {}).get("message") == "MailPin — Email Follow-up & Productivity", "nom FR MailPin incohérent")\ncheck(en_locale.get("extensionName", {}).get("message") == "MailPin — Email Follow-up & Productivity", "nom EN MailPin incohérent")'''
          new_block = '''expected_extension_name = "MailPin — Email Follow-up & Productivity"\ncheck(fr_locale.get("extensionName", {}).get("message") == expected_extension_name, "nom FR MailPin incohérent")\ncheck(en_locale.get("extensionName", {}).get("message") == expected_extension_name, "nom EN MailPin incohérent")\ncheck(len(fr_locale.get("extensionName", {}).get("message", "")) <= 50, "nom FR MailPin dépasse la limite ATN de 50 caractères")\ncheck(len(en_locale.get("extensionName", {}).get("message", "")) <= 50, "nom EN MailPin dépasse la limite ATN de 50 caractères")'''
          assert old_block in text
          check_repo_path.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')

          static_path = root / 'tests/static_checks.py'
          text = static_path.read_text(encoding='utf-8')
          old_block = '''assert fr_locale["extensionName"]["message"] == "MailPin — Email Follow-up & Productivity"\nassert en_locale["extensionName"]["message"] == "MailPin — Email Follow-up & Productivity"'''
          new_block = '''expected_extension_name = "MailPin — Email Follow-up & Productivity"\nassert fr_locale["extensionName"]["message"] == expected_extension_name\nassert en_locale["extensionName"]["message"] == expected_extension_name\nassert len(fr_locale["extensionName"]["message"]) <= 50\nassert len(en_locale["extensionName"]["message"]) <= 50'''
          assert old_block in text
          static_path.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          assert '## 1.7.5 ' not in changelog
          entry = '''## 1.7.5 — conformité du nom Add-ons for Thunderbird\n\n- raccourcit le nom localisé de l’extension à `MailPin — Email Follow-up & Productivity` afin de respecter la limite ATN de 50 caractères ;\n- conserve l’identifiant public `ussmarines.mailpin@addons.thunderbird.net` et la compatibilité Thunderbird `153.0` à `154.*` ;\n- ne modifie aucune logique métier, API Experiment, frontière `PinCompatibility`, permission, schéma, stockage, dépendance runtime, connexion réseau, télémétrie, publicité, CDN ou code distant.\n\n'''
          changelog_path.write_text(changelog.replace('# Journal des modifications\n\n', '# Journal des modifications\n\n' + entry, 1), encoding='utf-8')

          for rel in ['PRIVACY.md', 'THIRD_PARTY_NOTICES.md']:
              path = root / rel
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('1.7.4', '1.7.5'), encoding='utf-8')

          p = root / 'README.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace('![Source](https://img.shields.io/badge/source-v1.7.4-3D536B)', '![Source](https://img.shields.io/badge/candidate-v1.7.5-3D536B)')
          text = text.replace('**Version source :** `1.7.4` — publiée', '**Version source :** `1.7.5` — candidate')
          text = re.sub(r'\*\*Organic Workspace\*\* reste[^\n]*', '**Organic Workspace** reste inchangé dans la source 1.7.5 ; cette candidate modifie uniquement le nom public/localisé requis par ATN.', text)
          text = text.replace('dist/MailPin_v1.7.4.xpi', 'dist/MailPin_v1.7.5.xpi').replace('dist/MailPin_GitHub_Repository_v1.7.4.zip', 'dist/MailPin_GitHub_Repository_v1.7.5.zip')
          text = text.replace('[Audit sécurité source 1.7.4](SECURITY_AUDIT_1.7.4.md)', '[Audit sécurité source 1.7.5](SECURITY_AUDIT_1.7.5.md)')
          text = text.replace('[Rapport de validation source 1.7.4](VALIDATION_REPORT_1.7.4.md)', '[Rapport de validation source 1.7.5](VALIDATION_REPORT_1.7.5.md)')
          text = text.replace('Téléchargez `MailPin_v1.7.5.xpi` depuis la release `v1.7.4`.', 'Téléchargez `MailPin_v1.7.4.xpi` depuis la release `v1.7.4` tant que la candidate 1.7.5 n’est pas publiée.')
          p.write_text(text, encoding='utf-8')

          p = root / 'README.en.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace('![Source](https://img.shields.io/badge/source-v1.7.4-3D536B)', '![Source](https://img.shields.io/badge/candidate-v1.7.5-3D536B)')
          text = text.replace('**Source version:** `1.7.4` — published', '**Source version:** `1.7.5` — candidate')
          text = re.sub(r'\*\*Organic Workspace\*\* remains[^\n]*', '**Organic Workspace** is unchanged in source 1.7.5; this candidate only changes the public/localized add-on name required by ATN.', text)
          text = text.replace('dist/MailPin_v1.7.4.xpi', 'dist/MailPin_v1.7.5.xpi').replace('dist/MailPin_GitHub_Repository_v1.7.4.zip', 'dist/MailPin_GitHub_Repository_v1.7.5.zip')
          text = text.replace('[Source security audit 1.7.4](SECURITY_AUDIT_1.7.4.md)', '[Source security audit 1.7.5](SECURITY_AUDIT_1.7.5.md)')
          text = text.replace('[Source validation report 1.7.4](VALIDATION_REPORT_1.7.4.md)', '[Source validation report 1.7.5](VALIDATION_REPORT_1.7.5.md)')
          text = text.replace('Download `MailPin_v1.7.5.xpi` from release `v1.7.4`.', 'Download `MailPin_v1.7.4.xpi` from release `v1.7.4` while 1.7.5 remains a candidate.')
          p.write_text(text, encoding='utf-8')

          (root / 'PROJECT_MEMORY.md').write_text('''# Mémoire opérationnelle — MailPin\n\n> Version source : **1.7.5**\n> Dernière release publique : **1.7.4**\n> Branche courante : `release/atn-name-1.7.5` ; candidate de conformité ATN\n> Extension ID : `ussmarines.mailpin@addons.thunderbird.net`\n\n## Résumé\n\nMailPin est une extension Thunderbird Manifest V3 locale. La source 1.7.5 raccourcit uniquement le nom public/localisé à **MailPin — Email Follow-up & Productivity** afin de respecter la limite ATN de 50 caractères. La logique métier, l’API Experiment, `PinCompatibility`, les schémas, le stockage, les permissions et la plage Thunderbird 153.0–154.* restent inchangés. La release 1.7.4 a passé la QA `32300356172` et le smoke réel Thunderbird 154.0 `32300356085`; la candidate 1.7.5 doit repasser les gates applicables sur son head exact avant publication.\n\n## Invariants non négociables\n\n1. Aucun réseau runtime, télémétrie, publicité, CDN ou code distant.\n2. Épingler ne change jamais l’état lu/non lu ni les compteurs natifs.\n3. Aucun corps complet de message ni contenu de pièce jointe n’est stocké.\n4. Les entrées privilégiées restent bornées et normalisées.\n5. SQLite reste incrémental, transactionnel et sérialisé.\n6. Les listeners, observers, timers, menus, styles et nœuds injectés sont nettoyés.\n7. Les tags personnels Thunderbird restent intacts ; seuls les tags MailPin possédés peuvent être gérés.\n8. Aucune permission ou dépendance runtime nouvelle sans justification et test.\n9. `PinCompatibility` reste la frontière des accès Messages/Tags/Agenda.\n10. Organic Workspace utilise un seul stylesheet canonique pour la composition principale ; aucune feuille corrective runtime empilée n’est chargée.\n\n## Carte complète des fichiers\n\n- `extension/manifest.json`\n- `extension/background.js`\n- `extension/api/pinInbox/schema.json`\n- `extension/api/pinInbox/implementation.js`\n- `extension/api/pinInbox/modules/compatibility.js`\n- `extension/api/pinInbox/modules/thunderbird-messages.js`\n- `extension/api/pinInbox/modules/thunderbird-tags.js`\n- `extension/api/pinInbox/modules/thunderbird-calendar.js`\n- `extension/options/options.html`\n- `extension/dashboard/dashboard.html`\n- `PROJECT_MEMORY.md`\n- `docs/SECURITY_BOUNDARY.md`\n- `docs/BUG_TRACKER.md`\n- `docs/THUNDERBIRD_COMPATIBILITY.md`\n- `docs/THUNDERBIRD_TEST_BENCH.md`\n- `docs/CODEX_HANDOFF.md`\n\n## Où modifier quoi\n\n- composition Dashboard/Options : `extension/styles/workspace.css` ;\n- tokens et thèmes : `extension/styles/tokens.css`, `extension/styles/theme.js` ;\n- paramètres : `extension/options/` ; dashboard : `extension/dashboard/` ;\n- logique métier : `extension/api/pinInbox/modules/` ;\n- frontière Thunderbird : `extension/api/pinInbox/modules/compatibility.js` et adaptateurs `thunderbird-*.js` ;\n- smoke réel : `tests/thunderbird/real_smoke.py`, `.github/workflows/thunderbird-smoke.yml` ;\n- publication : `release/`, `STORE_RELEASE.md`, `docs/ATN_RELEASE_CHECKLIST.md`.\n\n## État technique courant\n\n- source : 1.7.5 candidate ; dernière release publique : 1.7.4 ;\n- Thunderbird : 153.0 à 154.* ;\n- permission WebExtension : `menus` uniquement ;\n- schémas : SQLite 5, settings 8, data 7 ;\n- aucune migration, permission, dépendance runtime ou connexion réseau introduite par 1.7.5 ;\n- release 1.7.4 : QA `32300356172` — PASS ; smoke Thunderbird 154.0 `32300356085` — PASS ;\n- candidate 1.7.5 : contrôle du nom, QA/build et smoke Thunderbird 154.0 frais requis avant merge/publication.\n\n## Commandes obligatoires\n\n```bash\nnpm run check\nnpm test\nnpm run build\nnpm run ci\n```\n\n## Définition de terminé\n\n- nom localisé ≤ 50 caractères et garde anti-régression ;\n- version source et dernière release publique déclarées sans ambiguïté ;\n- tests et build verts sur le diff applicable ;\n- smoke Thunderbird 154 réel frais sur le head versionné ;\n- aucune permission, schéma, réseau ou dépendance runtime injustifiée ;\n- documentation active alignée avec les preuves exactes ;\n- publication uniquement après les gates applicables démontrés.\n''', encoding='utf-8')

          (root / 'STORE_RELEASE.md').write_text('''# Préparation MailPin 1.7.5\n\n## État\n\n- **Version source :** 1.7.5 — candidate\n- **Dernière release publique :** 1.7.4\n- **ID permanent :** `ussmarines.mailpin@addons.thunderbird.net`\n- **Compatibilité :** Thunderbird 153.0 à 154.*\n\n## Portée 1.7.5\n\nLa 1.7.5 corrige uniquement la conformité du nom Add-ons for Thunderbird : le nom 1.7.4 embarqué faisait 56 caractères, au-delà de la limite ATN de 50. Le nom devient `MailPin — Email Follow-up & Productivity` (40 caractères).\n\nAucune logique métier, API Experiment, frontière `PinCompatibility`, permission, migration, schéma, stockage, dépendance runtime, connexion réseau, télémétrie, publicité, CDN ou code distant n’est modifié.\n\n## Artefacts attendus\n\n- `MailPin_v1.7.5.xpi` ;\n- `MailPin_GitHub_Repository_v1.7.5.zip` ;\n- `SHA256SUMS.txt`.\n\n## Gates\n\n- [x] cause ATN reproduite dans la 1.7.4 : nom localisé de 56 caractères ;\n- [x] nouveau nom mesuré à 40 caractères ;\n- [ ] QA Linux/Windows sur la candidate exacte ;\n- [ ] build reproductible et structure XPI ;\n- [ ] smoke Thunderbird 154.0 sur la candidate exacte ;\n- [ ] merge sur `main` ;\n- [ ] release `v1.7.5` et empreintes publiées ;\n- [ ] `npm run ci` depuis une extraction neuve de l’archive reviewer publiée sans `.git` ;\n- [ ] soumission ATN.\n''', encoding='utf-8')

          (root / 'docs/ATN_RELEASE_CHECKLIST.md').write_text('''# Checklist Add-ons for Thunderbird — MailPin 1.7.5\n\nDernière release GitHub publique : **1.7.4**. La **version source 1.7.5** est une candidate de conformité du nom ATN ; elle n’est pas encore publiée ni soumise à Add-ons for Thunderbird.\n\n## Identité et build\n\n- [x] ID `ussmarines.mailpin@addons.thunderbird.net` inchangé ;\n- [x] nom public/localisé `MailPin — Email Follow-up & Productivity` (40 caractères) ;\n- [x] aucune nouvelle dépendance runtime/build tierce ;\n- [x] aucune nouvelle permission WebExtension ;\n- [ ] QA/build sur le head exact 1.7.5 ;\n- [ ] merge et release `v1.7.5`.\n\n## Compatibilité Thunderbird\n\n- [x] Manifest V3, permission `menus` uniquement, plage Thunderbird 153.0–154.* inchangée ;\n- [x] release 1.7.4 : QA et smoke réel Thunderbird 154.0 PASS ;\n- [ ] smoke Thunderbird 154.0 sur la candidate 1.7.5 exacte.\n\n## Sécurité / review\n\n- [x] réseau runtime, télémétrie, publicité, CDN et code distant interdits ;\n- [x] aucune modification de stockage, schéma, logique métier ou `PinCompatibility` ;\n- [x] audit source `SECURITY_AUDIT_1.7.5.md` créé sans Codex Security ;\n- [ ] build reproductible validé ;\n- [ ] `npm run ci` depuis une extraction neuve de la source reviewer 1.7.5 sans `.git` avant soumission ATN ;\n- [ ] téléversement et revue humaine ATN.\n\nAucun contrôle non exécuté n’est présenté comme PASS.\n''', encoding='utf-8')

          (root / 'docs/KNOWN_LIMITATIONS.md').write_text('''# Limites connues — MailPin\n\n## Source 1.7.5 / release publique 1.7.4\n\nLa source **1.7.5** est une candidate de conformité ATN. La release publique **1.7.4** reste la dernière version publiée jusqu’aux gates finaux et à la publication 1.7.5.\n\n- compatibilité revendiquée : Thunderbird 153.0 à 154.* ;\n- le changement 1.7.5 porte uniquement sur le nom public/localisé, pas sur le comportement runtime ;\n- Agenda reste facultatif et dépend des capacités réelles du calendrier ;\n- fournisseurs réseau et calendriers distants restent des validations distinctes ;\n- aucune nouvelle permission, migration, dépendance runtime ou connexion réseau n’est introduite.\n''', encoding='utf-8')

          (root / 'docs/MANUAL_TEST_PLAN.md').write_text('''# Plan de test manuel MailPin — 1.7.5\n\nUtiliser de préférence un profil Thunderbird jetable pour les scénarios destructifs. Le présent plan complète les validations automatisées de la source 1.7.5 ; la dernière release publique est 1.7.4. Aucun contrôle non exécuté ne doit être présenté comme PASS.\n\n## Recette 1.7.5 — identité ATN\n\n1. Installer le XPI 1.7.5 dans Thunderbird 154.0.\n2. Vérifier que le nom affiché est `MailPin — Email Follow-up & Productivity`.\n3. Confirmer que l’extension démarre et que le panneau MailPin est injecté une seule fois.\n4. Ouvrir le Dashboard et confirmer un seul onglet.\n5. Épingler/désépingler un message et confirmer l’absence de changement lu/non-lu ou des compteurs natifs.\n6. Désinstaller/réinstaller et confirmer le nettoyage puis l’injection unique.\n\nLe XPI testé doit correspondre exactement à la candidate/release 1.7.5 concernée. La recette humaine n’est pas déclarée PASS tant qu’elle n’a pas été exécutée.\n''', encoding='utf-8')

          bug_path = root / 'docs/BUG_TRACKER.md'
          bug = bug_path.read_text(encoding='utf-8')
          bug = bug.replace('Version source : **1.7.4**', 'Version source : **1.7.5**', 1)
          if 'MP-2026-060' not in bug:
              marker = '| MP-2026-059 |'
              idx = bug.index(marker)
              line_end = bug.index('\n', idx)
              row = '| MP-2026-060 | 1.7.4 | ATN refuse la soumission car le nom embarqué de l’extension dépasse 50 caractères. | `extensionName` vaut `MailPin — Email Follow-up & Productivity for Thunderbird` (56 caractères) dans les locales FR/EN. | `extension/_locales/*/messages.json`, métadonnées et gardes de nom | `scripts/check_repo.py`, `tests/static_checks.py`, QA/build/smoke | À VALIDER | 1.7.5 | Nouveau nom `MailPin — Email Follow-up & Productivity` mesuré à 40 caractères ; candidate 1.7.5 à valider puis publier avant nouvelle soumission ATN. |\n'
              bug = bug[:line_end + 1] + row + bug[line_end + 1:]
          bug_path.write_text(bug, encoding='utf-8')

          (root / 'docs/CODEX_HANDOFF.md').write_text('''# Passage de relais — MailPin 1.7.5 candidate ATN\n\n## État\n\n- branche : `release/atn-name-1.7.5` ;\n- version source : **1.7.5** ;\n- dernière release publique : **1.7.4** ;\n- Thunderbird : 153.0 à 154.* ;\n- ID : `ussmarines.mailpin@addons.thunderbird.net`.\n\n## Objectif\n\nPublier une maintenance 1.7.5 qui raccourcit uniquement le nom localisé/store à `MailPin — Email Follow-up & Productivity` afin de respecter la limite ATN de 50 caractères.\n\n## Périmètre\n\nLocales FR/EN, métadonnées de nom, version/release/docs/tests associés. Aucun changement de logique métier, API Experiment, `PinCompatibility`, stockage, schéma, permission ou réseau.\n\n## Gates\n\nContrôle ciblé du nom ; QA Linux/Windows + build reproductible ; smoke Thunderbird 154.0 sur la candidate exacte ; merge puis publication `v1.7.5` ; reproduction `npm run ci` depuis l’archive reviewer publiée sans `.git`.\n\nCodex Security n’est pas requis.\n''', encoding='utf-8')

          (root / 'release/ATN_REVIEW_NOTES_TEMPLATE.md').write_text('''# Notes pour les reviewers ATN — MailPin 1.7.5\n\n## Statut\n\n- **Dernière release GitHub publique :** 1.7.4\n- **Source candidate :** 1.7.5\n- **Version :** 1.7.5\n- **Soumission ATN :** à effectuer après publication\n\n## Identité\n\n- **Nom :** MailPin — Email Follow-up & Productivity\n- **Version :** 1.7.5\n- **ID :** `ussmarines.mailpin@addons.thunderbird.net`\n- **Compatibilité :** Thunderbird 153.0 à 154.*\n- **Permission WebExtension :** `menus` uniquement\n\n## Correctif 1.7.5\n\nLe nom localisé précédent contenait 56 caractères et dépassait la limite ATN de 50 caractères. La 1.7.5 utilise `MailPin — Email Follow-up & Productivity` (40 caractères). Aucun comportement runtime n’est modifié.\n\nAucune permission, migration, dépendance runtime, télémétrie, publicité, connexion réseau ou code distant n’est ajouté.\n\n## Build\n\nVoir `release/BUILD_INSTRUCTIONS.md`. La commande reviewer est `npm run ci` depuis l’archive source extraite.\n\n## Test rapide\n\n1. Installer le XPI dans Thunderbird 154.0 et confirmer le nom `MailPin — Email Follow-up & Productivity`.\n2. Confirmer l’injection unique du panneau et du bouton Quick Filter.\n3. Ouvrir le Dashboard depuis le panneau et confirmer un seul onglet.\n4. Épingler/désépingler et confirmer l’absence de modification lu/non-lu ou compteurs natifs.\n5. Désinstaller/réinstaller et confirmer le nettoyage puis l’injection unique.\n\nVoir `PRIVACY.md`, `SECURITY.md`, `SECURITY_AUDIT_1.7.5.md` et `release/BUILD_INSTRUCTIONS.md`.\n''', encoding='utf-8')

          (root / 'release/BUILD_INSTRUCTIONS.md').write_text('''# Instructions de build pour les reviewers — MailPin 1.7.5\n\n## État\n\nLa release GitHub **1.7.4** est publiée. La source **1.7.5** est une candidate de conformité ATN ; elle conserve la compatibilité Thunderbird 153.0–154.*.\n\n## Environnement\n\n- Ubuntu 24.04 ou équivalent ;\n- Python 3.11+ ;\n- Node.js 20+ et npm 10+ ;\n- Git uniquement pour un checkout ou les contrôles d’historique.\n\nGit n’est pas requis pour reproduire le build depuis l’archive source extraite. Aucune dépendance npm/Python tierce n’est installée.\n\n## Reproduction\n\nDans un checkout de la source MailPin 1.7.5 ou dans l’archive reviewer extraite sans `.git` :\n\n```bash\nnpm run ci\n```\n\nLivrables :\n\n```text\ndist/MailPin_v1.7.5.xpi\ndist/MailPin_GitHub_Repository_v1.7.5.zip\ndist/SHA256SUMS.txt\n```\n\nLe contenu de `extension/` est placé directement à la racine du XPI. Aucun JavaScript/CSS n’est minifié, transpilé, concaténé, généré ou obfusqué.\n\n## Portée 1.7.5\n\nLa 1.7.5 raccourcit uniquement le nom localisé à `MailPin — Email Follow-up & Productivity` pour respecter la limite ATN de 50 caractères. Elle n’ajoute aucune permission, dépendance runtime, migration, schéma, réseau, télémétrie, publicité ou code distant.\n\nLes SHA-256 et preuves du head exact seront consignés après les gates et la publication.\n''', encoding='utf-8')

          meta_path = root / 'release/manifest-store-template.json'
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta['note'] = 'Référence de métadonnées pour MailPin 1.7.5 candidat. MailPin 1.7.4 publié reste la dernière release publique jusqu’aux gates et à la publication 1.7.5. Le nom public/localisé est raccourci à 40 caractères pour ATN.'
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          state_path = root / 'docs/PROJECT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['project'] = new_name
          state['extensionVersion'] = '1.7.5'
          state['baseGitHub'] = {'branch': 'main', 'commit': 'dbc67e903e682af37182c7a252f9f669ed2c48e2', 'role': 'published v1.7.4 baseline for the ATN name-compliance candidate'}
          state['developmentBranch'] = 'release/atn-name-1.7.5'
          state['testing']['browserStatus'] = 'No UI/runtime behavior change in 1.7.5; only the localized/public add-on name is shortened for ATN.'
          state['testing']['runtimeStatus'] = 'Published 1.7.4 passed QA 32300356172 and real Thunderbird 154.0 smoke 32300356085. The exact 1.7.5 candidate must pass fresh QA/build and Thunderbird 154 smoke before publication.'
          state['latestPublicVersion'] = '1.7.4'
          state['releaseStatus'] = 'candidate'
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          (root / 'SECURITY_AUDIT_1.7.5.md').write_text('''# Audit de sécurité — MailPin 1.7.5\n\n## Portée\n\nMailPin 1.7.5 est une maintenance de métadonnées pour conformité ATN. Le changement installable est limité au nom localisé/store et au numéro de version.\n\n## Invariants vérifiés par diff\n\n- ID `ussmarines.mailpin@addons.thunderbird.net` inchangé ;\n- Thunderbird 153.0–154.* inchangé ;\n- permission `menus` inchangée ;\n- aucune logique métier, API Experiment, `PinCompatibility`, stockage, schéma ou migration modifié ;\n- aucun réseau runtime, télémétrie, publicité, CDN ou code distant ajouté.\n\n## Gate\n\nLa candidate exacte doit passer les gardes standard et `npm run ci` avant publication. Codex Security n’est pas utilisé.\n''', encoding='utf-8')

          (root / 'VALIDATION_REPORT_1.7.5.md').write_text('''# Rapport de validation — MailPin 1.7.5\n\n## Objectif\n\nValider la correction de conformité ATN : le nom localisé de la 1.7.4 faisait 56 caractères alors que le formulaire ATN impose un maximum de 50.\n\n## Critères PASS/FAIL\n\nPASS exige :\n- `extensionName` FR et EN exactement `MailPin — Email Follow-up & Productivity` ;\n- longueur du nom = 40 caractères et ≤ 50 ;\n- version 1.7.5 synchronisée ;\n- ID et plage Thunderbird inchangés ;\n- QA Linux/Windows et build reproductible PASS ;\n- smoke Thunderbird 154.0 PASS sur le head exact ;\n- artefacts publiés et archive reviewer reproductible hors `.git`.\n\n## État\n\nLe contrôle statique du nom est préparé. Les gates CI/runtime/publication restent à exécuter et ne sont pas présentés comme PASS avant preuve.\n''', encoding='utf-8')

          identity_path = root / 'docs/IDENTITY_MIGRATION_REQUIRED.md'
          identity = identity_path.read_text(encoding='utf-8')
          identity = identity.replace('Nom public : **MailPin — Email Follow-up & Productivity**.', 'Nom public : **MailPin — Email Follow-up & Productivity** (forme ATN ≤ 50 caractères depuis 1.7.5).')
          identity_path.write_text(identity, encoding='utf-8')

          fr = json.loads((root / 'extension/_locales/fr/messages.json').read_text(encoding='utf-8'))
          en = json.loads((root / 'extension/_locales/en/messages.json').read_text(encoding='utf-8'))
          assert fr['extensionName']['message'] == new_name
          assert en['extensionName']['message'] == new_name
          assert len(fr['extensionName']['message']) <= 50
          assert len(en['extensionName']['message']) <= 50
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- BRANDING.md CHANGELOG.md PRIVACY.md PROJECT_MEMORY.md README.en.md README.md SECURITY_AUDIT_1.7.5.md STORE_RELEASE.md THIRD_PARTY_NOTICES.md VALIDATION_REPORT_1.7.5.md docs/ATN_RELEASE_CHECKLIST.md docs/BUG_TRACKER.md docs/CODEX_HANDOFF.md docs/DECISIONS.md docs/IDENTITY_MIGRATION_REQUIRED.md docs/KNOWN_LIMITATIONS.md docs/MANUAL_TEST_PLAN.md docs/PROJECT_STATE.json extension/_locales/en/messages.json extension/_locales/fr/messages.json extension/manifest.json package.json release/ATN_REVIEW_NOTES_TEMPLATE.md release/BUILD_INSTRUCTIONS.md release/manifest-store-template.json scripts/check_repo.py tests/static_checks.py
          git rm -- .github/workflows/prepare-1.7.5.yml
          git commit -m "release: prepare MailPin 1.7.5 ATN name compliance"

      - name: Verify exact candidate
        run: npm run ci

      - name: Verify localized store name in built XPI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          name = 'MailPin — Email Follow-up & Productivity'
          xpi = Path('dist/MailPin_v1.7.5.xpi')
          with zipfile.ZipFile(xpi) as z:
              manifest = json.loads(z.read('manifest.json'))
              fr = json.loads(z.read('_locales/fr/messages.json'))
              en = json.loads(z.read('_locales/en/messages.json'))
          assert manifest['version'] == '1.7.5'
          assert manifest['browser_specific_settings']['gecko']['id'] == 'ussmarines.mailpin@addons.thunderbird.net'
          assert manifest['browser_specific_settings']['gecko']['strict_max_version'] == '154.*'
          assert fr['extensionName']['message'] == name
          assert en['extensionName']['message'] == name
          assert len(name) == 40 and len(name) <= 50
          print('ATN localized name: 40 characters, XPI metadata OK')
          PY

      - name: Push prepared candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
