name: Temporary Thunderbird compatibility diagnosis

on:
  push:
    branches:
      - audit/full-release-hardening-2026-08-10
    paths:
      - .github/workflows/audit-runtime-compat-diagnose.yml

permissions:
  contents: read

env:
  GECKODRIVER_VERSION: "0.37.1"

jobs:
  smoke:
    name: Diagnose Thunderbird ${{ matrix.thunderbird }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        thunderbird: ["128.0esr", "140.13.0esr"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build XPI
        run: npm run check && npm run build
      - name: Download and verify Thunderbird
        shell: bash
        env:
          THUNDERBIRD_VERSION: ${{ matrix.thunderbird }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/thunderbird
          base="https://archive.mozilla.org/pub/thunderbird/releases/${THUNDERBIRD_VERSION}"
          sums=.runtime/thunderbird/SHA256SUMS
          curl --fail --location --proto '=https' --tlsv1.2 "$base/SHA256SUMS" -o "$sums"
          archive=""
          for candidate in \
            "linux-x86_64/en-US/thunderbird-${THUNDERBIRD_VERSION}.tar.xz" \
            "linux-x86_64/en-US/thunderbird-${THUNDERBIRD_VERSION}.tar.bz2"; do
            if awk -v path="$candidate" '$2 == path {found=1} END {exit !found}' "$sums"; then archive="$candidate"; break; fi
          done
          test -n "$archive"
          expected="$(awk -v path="$archive" '$2 == path {print $1; exit}' "$sums")"
          curl --fail --location --proto '=https' --tlsv1.2 "$base/$archive" -o .runtime/thunderbird/archive
          printf '%s  %s\n' "$expected" .runtime/thunderbird/archive | sha256sum --check --strict
          case "$archive" in
            *.tar.xz) tar -xJf .runtime/thunderbird/archive -C .runtime/thunderbird ;;
            *.tar.bz2) tar -xjf .runtime/thunderbird/archive -C .runtime/thunderbird ;;
            *) exit 2 ;;
          esac
      - name: Download and verify geckodriver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/geckodriver
          release_json=.runtime/geckodriver/release.json
          curl --fail --location --proto '=https' --tlsv1.2 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/mozilla/geckodriver/releases/tags/v${GECKODRIVER_VERSION}" -o "$release_json"
          python - <<'PY' > .runtime/geckodriver/asset.env
          import json, os, pathlib
          version = os.environ["GECKODRIVER_VERSION"]
          name = f"geckodriver-v{version}-linux64.tar.gz"
          data = json.loads(pathlib.Path(".runtime/geckodriver/release.json").read_text())
          asset = next(item for item in data.get("assets", []) if item.get("name") == name)
          digest = str(asset.get("digest") or "")
          if not digest.startswith("sha256:"):
              raise SystemExit("Missing geckodriver SHA-256 digest")
          print(f"URL={asset['browser_download_url']}")
          print(f"SHA={digest.removeprefix('sha256:')}")
          PY
          source .runtime/geckodriver/asset.env
          curl --fail --location --proto '=https' --tlsv1.2 "$URL" -o .runtime/geckodriver/geckodriver.tar.gz
          printf '%s  %s\n' "$SHA" .runtime/geckodriver/geckodriver.tar.gz | sha256sum --check --strict
          tar -xzf .runtime/geckodriver/geckodriver.tar.gz -C .runtime/geckodriver
      - name: Run diagnostic smoke
        shell: bash
        env:
          THUNDERBIRD_VERSION: ${{ matrix.thunderbird }}
        run: |
          set -euo pipefail
          xpi="$(find dist -maxdepth 1 -type f -name 'MailPerch_v*.xpi' -print -quit)"
          mkdir -p "artifacts/compat-${THUNDERBIRD_VERSION}"
          xvfb-run -a python - "$PWD/.runtime/thunderbird/thunderbird/thunderbird" "$xpi" "$PWD/.runtime/geckodriver/geckodriver" "artifacts/compat-${THUNDERBIRD_VERSION}" <<'PY'
          import argparse, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('tests/thunderbird').resolve()))
          import real_smoke as rs
          injection = r'''
          let mailperchTabManagerDiagnostics = [];
          try {
            const extension = ExtensionParent.GlobalManager.getExtension("pin-mails@MailPerch.local");
            for (const win of windows) {
              const tabmail = win.document?.getElementById("tabmail");
              for (const nativeTab of Array.from(tabmail?.tabInfo || [])) {
                let wrapper = null;
                let wrapperError = "";
                try { wrapper = extension?.tabManager?.getWrapper?.(nativeTab) || null; }
                catch (error) { wrapperError = String(error?.name || error); }
                const href = value => { try { return String(value?.location?.href || value?.currentURI?.spec || ""); } catch { return ""; } };
                mailperchTabManagerDiagnostics.push({
                  modeName: String(nativeTab?.mode?.name || ""),
                  wrapperId: Number(wrapper?.id ?? -1),
                  wrapperType: String(wrapper?.type || ""),
                  wrapperError,
                  nativeHasChromeBrowser: Boolean(nativeTab?.chromeBrowser),
                  nativeChromeHref: href(nativeTab?.chromeBrowser?.contentWindow) || href(nativeTab?.chromeBrowser),
                  nativeHasBrowser: Boolean(nativeTab?.browser),
                  nativeBrowserHref: href(nativeTab?.browser?.contentWindow) || href(nativeTab?.browser),
                  currentAbout3Pane: Boolean(tabmail?.currentAbout3Pane),
                  currentAbout3PaneHref: href(tabmail?.currentAbout3Pane),
                });
              }
            }
          } catch (error) {
            mailperchTabManagerDiagnostics = [{fatal: String(error?.name || error), detail: String(error?.message || error)}];
          }
          '''
          needle = 'done({\n  addon:'
          replacement = injection + '\ndone({\n  tabManagerDiagnostics: mailperchTabManagerDiagnostics,\n  addon:'
          if needle not in rs.RUNTIME_STATE_SCRIPT:
              raise SystemExit('runtime diagnostic injection point missing')
          rs.RUNTIME_STATE_SCRIPT = rs.RUNTIME_STATE_SCRIPT.replace(needle, replacement, 1)
          args = argparse.Namespace(binary=sys.argv[1], xpi=sys.argv[2], geckodriver=sys.argv[3], output_dir=sys.argv[4], timeout=60.0)
          raise SystemExit(rs.run(args))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compat-${{ matrix.thunderbird }}
          path: artifacts/compat-${{ matrix.thunderbird }}/
          if-no-files-found: warn
          retention-days: 1
