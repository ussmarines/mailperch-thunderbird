name: Temporary UI class contract fix
on:
  push:
    branches:
      - design/organic-workspace-ui
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ui-class-contract]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/organic-workspace-ui
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Fix canonical action class contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('extension/styles/workspace.css')
          text = path.read_text(encoding='utf-8')
          needle = '.settings-organic-stage .entity-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }'
          replacement = needle + '\n.case-editor-actions, .rule-builder-actions { min-width: 0; }'
          if needle not in text:
              raise SystemExit('entity-actions canonical rule missing')
          if '.case-editor-actions, .rule-builder-actions {' not in text:
              text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python tests/test_ui_polish_3_2_3.py
          python tests/test_organic_workspace_ui.py
          git diff --check
      - name: Commit canonical contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/styles/workspace.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): restore explicit action layout contracts [ui-class-contract]"
          git push origin HEAD:design/organic-workspace-ui
