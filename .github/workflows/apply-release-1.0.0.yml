name: Apply MailPerch 1.0.0 release preparation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'automation/release-1.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate release files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/mailperch-release-payload/part-* > /tmp/mailperch-release.patch.gz.b64
          base64 --decode /tmp/mailperch-release.patch.gz.b64 | gzip --decompress > /tmp/mailperch-release.patch
          git apply --binary /tmp/mailperch-release.patch
          rm -rf .github/mailperch-release-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare MailPerch 1.0.0"
          npm run ci

          # GitHub Actions tokens cannot update workflow files. Keep the current
          # workflow versions for this push; the authenticated GitHub connector
          # applies the validated ci.yml/release.yml files immediately afterward.
          git checkout HEAD^ -- .github/workflows/ci.yml .github/workflows/release.yml
          git add .github/workflows/ci.yml .github/workflows/release.yml
          git commit --amend --no-edit
          git push origin HEAD:"${GITHUB_HEAD_REF}"
