name: Temporary sync final bench evidence

on:
  push:
    branches: [audit/full-release-hardening-2026-08-10]
    paths: [.github/workflows/audit-sync-bench-evidence.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Synchronize verified bench evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          memory = Path('PROJECT_MEMORY.md')
          s = memory.read_text()
          anchor = 'La passe réelle Windows sur Thunderbird 153.0.2/geckodriver 0.37.1 a validé les cinq volumes, la pagination sans doublon et les scénarios multi-comptes. La persistance entre deux processus avec une extension temporaire reste limitée par le harness : le stockage SQLite peut être supprimé lors de la fermeture de l’extension temporaire ; ce point n’est pas présenté comme un défaut produit.\n'
          addition = anchor + '\nLe 10 août 2026, une nouvelle passe Linux sur Thunderbird 153.0.1 ESR/geckodriver 0.37.1 a revalidé la matrice 50/100/500/1000/2000 après correction d’une assertion erronée du harness : le compteur du panneau reste volontairement le total de la portée pendant une recherche, tandis que seules les cartes rendues sont filtrées. Les cinq volumes passent sans timeout ni exception JavaScript ; à 500/1000/2000, toute la pagination est chargée sans doublon et les positions début/milieu/fin sont présentes.\n'
          if addition not in s:
              if anchor not in s: raise SystemExit('PROJECT_MEMORY bench anchor missing')
              memory.write_text(s.replace(anchor, addition, 1))

          bench = Path('docs/THUNDERBIRD_TEST_BENCH.md')
          s = bench.read_text()
          anchor = 'La passe fonctionnelle Windows du 9 août 2026 sur Thunderbird 153.0.2/geckodriver 0.37.1 a validé les volumes 50/100/500/1000/2000 et la sélection multi-comptes dans la première session. La sauvegarde Options → panneau et les icônes clair/sombre ont ensuite été confirmées manuellement. La persistance automatisée entre processus avec une extension temporaire reste la limite du harness décrite plus haut.\n'
          addition = anchor + '\nLe 10 août 2026, le banc a été relancé sous Linux avec Thunderbird 153.0.1 ESR et geckodriver 0.37.1 après correction d’une fausse assertion du harness : `.pin-mails-count` représente le total de la portée et ne doit pas devenir le nombre de cartes filtrées par la recherche. Le test contrôle désormais séparément la stabilité de ce total, l’appartenance de chaque carte au résultat recherché et le nombre exact de cartes après pagination. Le cas ciblé 50 épingles puis la matrice complète 50/100/500/1000/2000 ont tous réussi, avec zéro timeout et zéro exception JavaScript. À 500, 1000 et 2000, la pagination complète a rendu respectivement 500, 1000 et 2000 cartes sans doublon et les contrôles début/milieu/fin sont positifs.\n'
          if addition not in s:
              if anchor not in s: raise SystemExit('THUNDERBIRD_TEST_BENCH proof anchor missing')
              bench.write_text(s.replace(anchor, addition, 1))

          tracker = Path('docs/BUG_TRACKER.md')
          s = tracker.read_text()
          marker = '| MP-2026-023 | consolidation post-1.2.1 |'
          row = '| MP-2026-028 | 1.5.1 (banc) | Le banc 50–2000 échouait sur `selected-account search count A` alors que le produit rendait correctement les cartes filtrées. | Le harness comparait à tort `.pin-mails-count` au nombre de résultats de recherche ; ce compteur représente volontairement le total de la portée. | `tests/thunderbird/functional_bench.py`, `tests/test_thunderbird_test_bench.py` | garde du banc + exécution Thunderbird 153.0.1 ESR | CORRIGÉ | 1.5.1 | Le test vérifie séparément total de portée, contenu filtré et pagination ; cas 50 puis matrice 50/100/500/1000/2000 verts le 10 août 2026, 0 timeout, 0 exception JS. |\n'
          if row not in s:
              if marker not in s: raise SystemExit('BUG_TRACKER insertion anchor missing')
              s = s.replace(marker, row + marker, 1)
              tracker.write_text(s)

          state = Path('docs/AI_VALIDATION_STATE.json')
          data = json.loads(state.read_text())
          check_id = 'thunderbird-153-scale-bench-1.5.1'
          item = {
            'id': check_id,
            'result': 'success',
            'validated_commit': '1072e1a58b9d02aa0c5ca843ba800f5423a34fbc',
            'validated_tree': 'd2d052e0fbf9c58afffe90b9170c03b06d5079aa',
            'validated_at': '2026-08-10T22:01:55+02:00',
            'command': 'GitHub Actions runtime: targeted --volumes 50, then --volumes 50,100,500,1000,2000',
            'environment': {
              'os': 'Ubuntu 24.04.4',
              'thunderbird': '153.0.1esr',
              'geckodriver': '0.37.1',
              'python': '3.12.13',
              'node': '24.18.0'
            },
            'invalidates_on': [
              'extension/**',
              'tests/thunderbird/functional_bench.py',
              'tests/test_thunderbird_test_bench.py',
              'scripts/build.py',
              'package.json'
            ],
            'evidence': {
              'kind': 'github-actions-real-thunderbird',
              'run_id': 31426885156,
              'artifact_id': 9077569989,
              'artifact_sha256': '55f0593c8c385f5336f664fd6f6fcf1c0a14d3bc992621b8fba0f732a0c82dac',
              'summary': 'Targeted 50-pin case and full 50/100/500/1000/2000 matrix passed on real Thunderbird 153.0.1 ESR; zero timeouts and JavaScript exceptions; full pagination verified at 500/1000/2000.'
            },
            'notes': 'The harness was corrected to preserve the scope-total counter during search while validating the exact filtered-card count separately.'
          }
          checks = [entry for entry in data.get('targeted_checks', []) if entry.get('id') != check_id]
          checks.append(item)
          data['targeted_checks'] = checks[-32:]
          state.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          python scripts/check_project_memory.py
          python scripts/check_bug_tracker.py
          python tests/test_thunderbird_test_bench.py
          git diff --check
      - name: Commit evidence synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_MEMORY.md docs/THUNDERBIRD_TEST_BENCH.md docs/BUG_TRACKER.md docs/AI_VALIDATION_STATE.json
          git commit -m "docs: record final Thunderbird scale validation"
          git push origin HEAD:audit/full-release-hardening-2026-08-10
