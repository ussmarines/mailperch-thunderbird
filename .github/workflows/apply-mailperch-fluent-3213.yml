name: Apply MailPerch Fluent 2 update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'automation/fluent-2-3213'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply, commit and validate tested Fluent 2 files
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/mailperch-fluent-payload/part-00 \
            .github/mailperch-fluent-payload/part-01 \
            .github/mailperch-fluent-payload/part-02 \
            .github/mailperch-fluent-payload/part-03 \
            .github/mailperch-fluent-payload/part-04 \
            .github/mailperch-fluent-payload/part-05a \
            .github/mailperch-fluent-payload/part-05b \
            .github/mailperch-fluent-payload/part-06a \
            .github/mailperch-fluent-payload/part-06b \
            .github/mailperch-fluent-payload/part-07a \
            .github/mailperch-fluent-payload/part-07b \
            .github/mailperch-fluent-payload/part-08 \
            > /tmp/mailperch-fluent.tar.gz
          tar -xzf /tmp/mailperch-fluent.tar.gz -C .
          rm -rf .github/mailperch-fluent-payload
          rm -f .github/workflows/apply-mailperch-fluent-3213.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: complete MailPerch Fluent 2 interface"
          npm run ci
          git push origin HEAD:"${GITHUB_HEAD_REF}"
