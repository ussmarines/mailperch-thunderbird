name: Post-release sync

on:
  push:
    branches:
      - "workflow-dispatch-probe"

permissions:
  contents: write

concurrency:
  group: mailpin-post-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore canonical main and apply validated post-release patch
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="c2b886677413a205d57a191234b1dac6279b86d6"
          git checkout "$MAIN_SHA" -- .
          PATCH_GZ_B64=''
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/postrelease.patch
          git apply --index /tmp/postrelease.patch
          test "$(git write-tree)" = "05c1c66ea388071159c9408617b19c3b2e401195"
          git diff --cached --check
      - name: Validate post-release state
        run: |
          set -euo pipefail
          npm run check
          python tests/test_project_metadata.py
      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "05c1c66ea388071159c9408617b19c3b2e401195"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(release): finalize MailPin 1.7.1 publication"
          git push origin HEAD:workflow-dispatch-probe
